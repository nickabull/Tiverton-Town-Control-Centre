name: Check programme post-match integrations
on:
  push:
    branches: [main]
    paths:
      - scripts/export-tivvy-programme-postmatch.py
      - scripts/generate-tivvy-match-facts.py
      - scripts/publish-manual-facebook-post.py
      - tests/test-manual-facebook.py
      - tivvy-facebook-scratchpad.html
      - tivvy-live-tv.html
      - tivvy-live-saturday-test.html
      - league-so-far.html
      - .github/workflows/check-postmatch-integrations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-fixture-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify manual commentary and HTML JavaScript
        run: |
          python3 tests/test-manual-facebook.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          for filename in ['tivvy-facebook-scratchpad.html','tivvy-live-tv.html','tivvy-live-saturday-test.html']:
              page=Path(filename).read_text()
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',page,flags=re.I|re.S)
              assert scripts,filename
              Path('/tmp/'+filename+'.js').write_text(chr(10).join(scripts))
          PY
          for file in tivvy-facebook-scratchpad.html tivvy-live-tv.html tivvy-live-saturday-test.html; do node --check "/tmp/$file.js"; done
      - name: Compile programme post-match exporter
        run: python -m py_compile scripts/export-tivvy-programme-postmatch.py scripts/generate-tivvy-match-facts.py
      - name: Validate verified match-facts rendering without external feeds
        run: |
          python3 scripts/generate-tivvy-match-facts.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('data/tivvy-programme-postmatch-20261121.json').read_text())
          assert d['verified'] and d['lineupsVerified']
          rendered=Path('match-facts/2026-11-21.html').read_text()
          for expected in ['Melksham Town','Tiverton Town','Evander Grubb','Louis Jagger Cane','Asa Hall','Starting XI','Substitutes']:
              assert expected in rendered,expected
          assert '64' in rendered and '(pen)' in rendered
          print('Verified Melksham match facts HTML PASS')
          PY
      - name: Confirm fixture discovery handles new matchdays
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import runpy
          api=runpy.run_path("scripts/export-tivvy-programme-postmatch.py")
          today=datetime.now(timezone.utc).date().isoformat()
          assert today in api["fixture_dates"]({"fixtures":[{"date":today,"competition":"SLD1S"}]})
          assert today not in api["fixture_dates"]({"fixtures":[{"date":today,"competition":"FA CUP"}]})
          print("Dynamic league match discovery PASS")
          PY
      - name: Check public League So Far inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("league-so-far.html").read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.I|re.S)
          assert scripts, "No inline JS scripts found"
          Path("/tmp/tivvy-league-so-far.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/tivvy-league-so-far.js
