name: Deploy Tivvy Live collector
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'live-collector/**'
      - '.github/workflows/deploy-tivvy-live-service.yml'
permissions:
  contents: read
concurrency:
  group: tivvy-live-collector-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check collector and Saturday page JavaScript syntax
        shell: bash
        run: |
          set -e
          node --check live-collector/src/index.js
          grep -q 'async alarm()' live-collector/src/index.js
          grep -q 'async scheduled(event,env,ctx)' live-collector/src/index.js
          grep -q 'crons = ' live-collector/wrangler.toml
          python3 - <<'PY'
          from pathlib import Path
          page=Path("tivvy-live-saturday-test.html").read_text()
          js=page.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/tivvy-saturday.js").write_text(js)
          assert "TivvyMatchday" in js
          PY
          node --check /tmp/tivvy-saturday.js
          node --check live/matchday.js
      - name: Deploy shared live collector to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: live-collector
          command: deploy
          secrets: |
            X_BEARER_TOKEN
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - name: Verify the released collector and an official fixture
        shell: bash
        run: |
          set -euo pipefail
          service=https://tivvy-live-collector.nickabull.workers.dev
          version=$(sed -n 's/.*version:"\([^"]*\)".*/\1/p' live-collector/src/index.js)
          test -n "$version"
          curl --retry 3 --max-time 25 -fsS "$service/health" | jq -e --arg version "$version" '.status == "ok" and .version == $version'
          today=$(TZ=Europe/London date +%F)
          registry=https://nickabull.github.io/Tiverton-Town-Get-Player-Info/match-centre-fixtures-2026-27.json
          date=$(curl --retry 2 --max-time 20 -fsS "$registry" | jq -er --arg today "$today" '.fixtures | map(select(.date >= $today and .competition == "SLD1S" and ((.result // "") == ""))) | sort_by(.date, .kickOff) | first | .date // empty')
          test -n "$date"
          curl --retry 2 --max-time 25 -fsS "$service/log?date=$date" | jq -e --arg date "$date" '.status == "ok" and .date == $date and .pollIntervalSeconds == 20 and (.events | type == "array")'
          curl --retry 2 --max-time 35 -fsS "$service/live?date=$date" | jq -e --arg date "$date" '.matchday.date == $date and .matchday.status == "ok" and (.matchday.featured | type == "object")' 
          echo "Release, audit response and official fixture verified. In-play cadence requires match observation."
