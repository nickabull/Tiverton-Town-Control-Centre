name: Deploy Tivvy Live collector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy shared live collector to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: live-collector
          command: deploy
          secrets: |
            X_BEARER_TOKEN
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
