name: Deploy Tivvy Programme storage (isolated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual diagnostic dry-run or explicit deploy; code pushes deploy automatically"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - deploy
  push:
    branches: [main]
    paths:
      - "v3-backend/src/index.js"
      - ".github/workflows/deploy-tivvy-programme-storage.yml"

permissions:
  contents: read

concurrency:
  group: tivvy-programme-storage-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v3-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate exact isolated source and JavaScript syntax
        run: |
          set -euo pipefail
          test -f src/index.js
          node --check src/index.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const source=fs.readFileSync('src/index.js','utf8');
          for(const name of ['storagePortal','cloudImportPortal','cloudWorkspacePortal','assetLibraryPortal','activityLogPortal','sourcesHubPortal','fullDesignerTrialPortal','referenceMigrationPortal']){
            const start=source.indexOf('function '+name+'()');
            if(start<0)throw Error('Missing protected portal '+name);
            const snippet=source.slice(start,source.indexOf('return new Response(html',start));
            const match=snippet.match(/const html=`([\s\S]*?)`;/);
            if(!match)throw Error('HTML template missing in '+name);
            const html=new Function('return `'+match[1]+'`;')();
            const js=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
            if(!js)throw Error('Client JavaScript missing in '+name);
            new Function(js);
            process.stdout.write('Validated '+name+' client JavaScript\n');
          }
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const page=fs.readFileSync('../programme-designer-v3-editor.html','utf8');
          if(!page.includes('V3_CLOUD_TRIAL')||!page.includes('tivvy-cloud-layer-snapshot')||!page.includes('tivvy-cloud-load'))throw Error('Original V3 cloud bridge missing');
          const script=page.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!script)throw Error('Original editor script missing');
          new Function(script);
          process.stdout.write('Original V3 native editor cloud bridge validated\n');
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const backend=fs.readFileSync('src/index.js','utf8');
          for(const marker of ['ensureReferencePages(env)','setReferencePage(env,actor','crypto.subtle.digest("SHA-256",raw)',
            'reference-pages','reference.import','getReferencePage(env,issueId']){
            if(!backend.includes(marker))throw Error('Missing original-reference migration guard: '+marker);
          }
          const original=fs.readFileSync('../programme-designer-v3-editor.html','utf8');
          if(!original.includes('cloudReferenceURL')||!original.includes('referenceURL'))throw Error('Original native trace cloud bridge missing');
          const shell=fs.readFileSync('../programme-designer-v3.html','utf8');
          if(!shell.includes('exportStoredReferenceZip')||!shell.includes('compression:"STORE"'))throw Error('Browser JPEG export is not byte-preserving');
          process.stdout.write('Verified original-PDF reference migration safety guards\n');
          JS
          grep -q 'tivvy-v3-storage' src/index.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const src=fs.readFileSync('src/index.js','utf8');
          const full=src.slice(src.indexOf('function fullDesignerTrialPortal()'),src.indexOf('\nexport default {'));
          for(const required of ['showConflict(', 'checkRemote(', 'exportRecovery(', 'discardAndReload',
            'CLOUD SAVE BLOCKED', 'expected_version:previous', 'keepLocal()', 'copy.version=read.version']){
            if(!full.includes(required))throw Error('Native editor conflict protection missing: '+required);
          }
          const backend=src.slice(src.indexOf('async function saveIssue('),src.indexOf('async function restoreIssue('));
          for(const required of ['current_version=?', 'expected', 'Version conflict', 'ownRevision']){
            if(!backend.includes(required))throw Error('D1 optimistic-concurrency guard missing: '+required);
          }
          process.stdout.write('Native editor concurrent-save protection static check passed\n');
          JS
          grep -q 'verifiedAccessIdentity' src/index.js
          grep -q 'env.ASSETS' src/index.js
          grep -q 'env.DB' src/index.js
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Generate isolated config only when required inputs are present
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.TIVVY_PROGRAMME_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub secret"; exit 1; }
          test -n "$CF_D1_ID" || { echo "::error::Missing TIVVY_PROGRAMME_D1_DATABASE_ID GitHub secret"; exit 1; }
          python3 - <<'PY'
          import json,os,re
          db=os.environ["CF_D1_ID"].strip()
          assert re.fullmatch(r"[0-9a-fA-F-]{32,36}",db), "D1 ID must be a Cloudflare database UUID"
          cfg={
            "name":"tivvy-programme-v3-storage",
            "main":"src/index.js",
            "compatibility_date":"2026-11-17",
            "workers_dev":True,
            "preview_urls":False,
            "keep_vars":True,
            "triggers":{"crons":["15 4 * * *"]},
            "d1_databases":[{"binding":"DB","database_name":"tivvy-programme-v3","database_id":db}],
            "r2_buckets":[{"binding":"ASSETS","bucket_name":"tivvy-programme-v3-assets"}]
          }
          with open("wrangler.programme.generated.json","w") as f:json.dump(cfg,f)
          print("Generated config for named storage Worker, DB and R2 binding. No credentials printed.")
          PY
      - name: Build and inspect only, no deployment
        run: npx wrangler deploy --config wrangler.programme.generated.json --dry-run --outdir /tmp/tivvy-programme-compiled
      - name: Deploy programme storage on scoped main push or explicit manual deploy
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TIVVY_PROGRAMME_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing scoped TIVVY_PROGRAMME_CLOUDFLARE_API_TOKEN"; exit 1; }
          npx wrangler deploy --config wrangler.programme.generated.json
          echo "Deployment submitted only for tivvy-programme-v3-storage."
          echo "Worker deployed; following smoke check tests unauthenticated access without credentials."
      - name: Verify Access-protected API is not anonymously accessible
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error
          base="https://tivvy-programme-v3-storage.nickabull.workers.dev"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect)
          for route in ("/api/issues","/cloud-vault","/cloud-import","/cloud-workspace","/artwork-library","/activity-log","/source-hub","/api/library/assets","/api/activity","/api/sources/viv","/api/sources/live","/full-designer","/full-editor-frame","/reference-migration","/api/issues/work_missing/reference-pages"):
              req=urllib.request.Request(base+route,headers={"User-Agent":"tivvy-storage-deploy-smoke/1.0"})
              try:
                  resp=opener.open(req,timeout=20)
                  status=resp.status
                  headers=resp.headers
                  resp.close()
              except urllib.error.HTTPError as e:
                  status=e.code
                  headers=e.headers
              assert status in (301,302,303,307,308,401,403), f"UNSAFE: anonymous {route} returned HTTP {status}"
              if 300<=status<400:
                  target=headers.get("Location","")
                  assert "cloudflareaccess.com" in target or "/cdn-cgi/access/" in target, f"Unexpected redirect on {route}"
              print(f"Anonymous access rejected for {route}: HTTP {status}")
          PY
          echo "Deployment reached protected endpoints. Authenticated cloud save/recovery QA remains separate."
