name: Deploy Tivvy Programme storage (isolated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry run first; deploy requires explicit mode and secrets"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - deploy
  push:
    branches: [main]
    paths:
      - "v3-backend/src/index.js"
      - ".github/workflows/deploy-tivvy-programme-storage.yml"

permissions:
  contents: read

concurrency:
  group: tivvy-programme-storage-deploy
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || vars.TIVVY_PROGRAMME_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v3-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate exact isolated source and JavaScript syntax
        run: |
          set -euo pipefail
          test -f src/index.js
          node --check src/index.js
          grep -q 'tivvy-v3-storage' src/index.js
          grep -q 'verifiedAccessIdentity' src/index.js
          grep -q 'env.ASSETS' src/index.js
          grep -q 'env.DB' src/index.js
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Generate isolated config only when required inputs are present
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.TIVVY_PROGRAMME_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub secret"; exit 1; }
          test -n "$CF_D1_ID" || { echo "::error::Missing TIVVY_PROGRAMME_D1_DATABASE_ID GitHub secret"; exit 1; }
          python3 - <<'PY'
          import json,os,re
          db=os.environ["CF_D1_ID"].strip()
          assert re.fullmatch(r"[0-9a-fA-F-]{32,36}",db), "D1 ID must be a Cloudflare database UUID"
          cfg={
            "name":"tivvy-programme-v3-storage",
            "main":"src/index.js",
            "compatibility_date":"2026-11-17",
            "workers_dev":True,
            "preview_urls":False,
            "keep_vars":True,
            "d1_databases":[{"binding":"DB","database_name":"tivvy-programme-v3","database_id":db}],
            "r2_buckets":[{"binding":"ASSETS","bucket_name":"tivvy-programme-v3-assets"}]
          }
          with open("wrangler.programme.generated.json","w") as f:json.dump(cfg,f)
          print("Generated config for named storage Worker, DB and R2 binding. No credentials printed.")
          PY
      - name: Build and inspect only, no deployment
        run: npx wrangler deploy --config wrangler.programme.generated.json --dry-run --outdir /tmp/tivvy-programme-compiled
      - name: Deploy this Worker only when explicitly enabled
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy') || (github.event_name == 'push' && vars.TIVVY_PROGRAMME_AUTO_DEPLOY == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TIVVY_PROGRAMME_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing scoped TIVVY_PROGRAMME_CLOUDFLARE_API_TOKEN"; exit 1; }
          npx wrangler deploy --config wrangler.programme.generated.json
          echo "Deployment submitted only for tivvy-programme-v3-storage."
          echo "Authenticated Cloud Vault browser QA still required; this is not proof of functional save/recovery."
