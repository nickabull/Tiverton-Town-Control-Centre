name: Refresh programme verified post-match data
on:
  push:
    branches: [main]
    paths:
      - scripts/export-tivvy-programme-postmatch.py
      - scripts/generate-tivvy-match-facts.py
      - .github/workflows/export-tivvy-programme-postmatch.yml
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tivvy-programme-postmatch-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate non-destructive official full-time programme exports
        run: python3 scripts/export-tivvy-programme-postmatch.py
      - name: Generate HTML match-facts embeds from verified full-time exports
        run: python3 scripts/generate-tivvy-match-facts.py
      - name: Validate JSON exports
        run: |
          for f in data/tivvy-programme-postmatch-*.json; do
            if [ -f "$f" ]; then python3 -m json.tool "$f" > /dev/null; fi
          done
      - name: Publish changed exports
        run: |
          git config user.name "tivvy-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tivvy-programme-postmatch-*.json match-facts/*.html || true
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Tivvy post-match data and report embeds"
            # Other site edits can land while this scheduled job is running.
            # Rebase only our generated commit, then retry the push safely.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent commit detected; retrying publish ($attempt/3)"
              sleep 3
            done
            echo "Could not publish generated match facts after 3 attempts" >&2
            exit 1
          else
            echo "No changes"
          fi
