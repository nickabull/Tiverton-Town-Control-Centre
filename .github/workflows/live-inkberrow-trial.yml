name: Tivvy Live Inkberrow v Hungerford collector
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-live-inkberrow.py'
      - '.github/workflows/live-inkberrow-trial.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 18-22 10 11 *'
permissions:
  contents: write
concurrency:
  group: inkberrow-hungerford-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and publish match diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            python scripts/probe-live-inkberrow.py
            git add data/live-test-inkberrow-hungerford.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Inkberrow live diagnostic [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            now=$(date -u +%s)
            start=$(date -u -d '2026-11-10 18:30:00' +%s)
            end=$(date -u -d '2026-11-10 22:45:00' +%s)
            if [ "$now" -lt "$start" ] || [ "$now" -ge "$end" ]; then break; fi
            if [ "$attempt" -lt 4 ]; then sleep 60; fi
          done
