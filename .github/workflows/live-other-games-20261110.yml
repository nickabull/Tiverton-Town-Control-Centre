name: Tivvy Live - Other Games - 10 Nov 2026
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-live-other-games-20261110.py'
      - '.github/workflows/live-other-games-20261110.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 18-22 10 11 *'
permissions:
  contents: write
concurrency:
  group: tivvy-other-games-20261110
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch this fixture set and publish one snapshot
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/probe-live-other-games-20261110.py
          git add data/live-other-games-20261110.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh other games with event records [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
