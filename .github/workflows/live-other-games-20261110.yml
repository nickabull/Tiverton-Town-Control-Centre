name: Tivvy Live - Other Games - 10 Nov 2026
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-live-other-games-20261110.py'
      - '.github/workflows/live-other-games-20261110.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 18-22 10 11 *'
permissions:
  contents: write
concurrency:
  group: tivvy-other-games-20261110
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect other Division One South fixtures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 210); do
            python scripts/probe-live-other-games-20261110.py
            git add data/live-other-games-20261110.json
            if ! git diff --cached --quiet; then
              git commit -m "Update other games trial [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            now=$(date -u +%s)
            start=$(date -u -d '2026-11-10 18:30:00' +%s)
            end=$(date -u -d '2026-11-10 22:45:00' +%s)
            if [ "$now" -lt "$start" ] || [ "$now" -ge "$end" ]; then break; fi
            sleep 60
          done
