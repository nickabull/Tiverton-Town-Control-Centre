name: Tivvy Live FA Cup two-source trial
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-live-parkway.py'
      - '.github/workflows/live-parkway-trial.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parkway-match-night-collector
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and publish every minute until match-night cutoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cutoff=$(date -u -d '2026-11-09 22:45:00' +%s)
          for attempt in $(seq 1 95); do
            python scripts/probe-live-parkway.py
            git add data/live-test-parkway-berkhamsted.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Parkway live-feed diagnostic [skip ci]"
              git pull --rebase origin main
              git push
            fi
            now=$(date -u +%s)
            if [ "$now" -ge "$cutoff" ]; then break; fi
            sleep 60
          done
