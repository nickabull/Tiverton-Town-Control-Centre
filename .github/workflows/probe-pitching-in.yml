name: Probe Pitching In sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run source probe
        run: python3 scripts/probe_pitching_in.py

      - name: Commit probe result
        run: |
          git config user.name "Tivvy Control Centre"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-probe.json
          git diff --cached --quiet || git commit -m "Update Pitching In source probe"
          git push
