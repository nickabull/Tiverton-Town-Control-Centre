name: Publish manually transcribed Tivvy Facebook commentary
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
concurrency:
  group: tivvy-facebook-manual-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.issue.user.login == 'nickabull' && github.event.issue.title == '[TIVVY FB] 2026-11-23'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Parse and verify user-supplied commentary
        run: python3 scripts/publish-manual-facebook-post.py
      - name: Publish manual-commentary snapshot
        run: |
          git config user.name "tivvy-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tivvy-manual-facebook-2026-11-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish approved manual Facebook matchday commentary"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Could not publish manual commentary" >&2
          exit 1
