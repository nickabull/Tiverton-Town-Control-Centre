name: Tivvy Southern League matchday tabs
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-southern-matchday-tabs.py'
      - '.github/workflows/southern-matchday-tabs.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/10 17-23 * * *'
    - cron: '*/10 12-18 * * 6'
permissions:
  contents: write
concurrency:
  group: matchday-tabs-snapshot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect fixtures (official source)
        run: python scripts/collect-southern-matchday-tabs.py
      - name: Publish matchday snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/southern-league-matchday-tabs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Southern League matchday tab data [skip ci]"
          git pull --rebase origin main
          git push
