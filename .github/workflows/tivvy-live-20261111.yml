name: Tivvy Live - Paulton Test - 11 Nov 2026
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-tivvy-live-20261111.py'
      - '.github/workflows/tivvy-live-20261111.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 8-23 11 11 *'
permissions:
  contents: write
concurrency:
  group: tivvy-live-20261111
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect verified Southern League matchday data
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/probe-tivvy-live-20261111.py
          git add data/tivvy-live-20261111.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Paulton and Southern League matchday [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
