name: Update Viv Flickr catalogue

on:
  workflow_dispatch:
    inputs:
      album_id:
        description: 'Optional Tiverton album ID to index; leave blank for the newest album'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: viv-flickr-catalogue
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public Tiverton albums and selected photos
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          FLICKR_ALBUM_ID: ${{ inputs.album_id }}
        run: python3 scripts/collect_flickr.py --album-id "$FLICKR_ALBUM_ID"
      - name: Save public catalogue
        run: |
          git config user.name "Tivvy Control Centre"
          git config user.email "actions@users.noreply.github.com"
          git add data/flickr-catalogue.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Viv public Tiverton photo catalogue"
            git pull --rebase origin main
            git push
          fi
