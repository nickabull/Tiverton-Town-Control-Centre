<style>.a{font-family:Antonio,'Arial Narrow',Arial,sans-serif}.h{font-size:43px;font-weight:900;fill:#111}.sub{font-size:24px;font-weight:700;fill:#333}.body{font-size:22px;fill:#222}.sm{font-size:19px;fill:#333}.num{font-size:78px;font-weight:900;fill:#111}</style>
<rect width="720" height="730" fill="#ffffff"/>
<text class="a h" x="24" y="62">THE DAY TIVVY HIT SEVEN</text>
<text class="a sub" x="24" y="105">27 OCTOBER 1962  |  64 YEARS AGO TODAY</text>
<rect x="24" y="135" width="672" height="164" rx="0" fill="#ffd400"/>
<text class="a num" x="360" y="231" text-anchor="middle">7 - 0</text>
<text class="a sub" x="360" y="272" text-anchor="middle">TIVERTON TOWN  v  CLYST VALLEY</text>
<text class="a body" x="24" y="349">On Saturday 27 October 1962, Tiverton Town treated</text>
<text class="a body" x="24" y="381">the Ladysmead crowd to a seven-goal masterclass</text>
<text class="a body" x="24" y="413">against Clyst Valley in the Exeter &amp; District League.</text>
<rect x="24" y="442" width="6" height="181" fill="#ffd400"/>
<text class="a sub" x="48" y="483">ALEC COLLARD  —  FOUR GOALS</text>
<text class="a body" x="48" y="524">Ben White, Bobby Westcott and Ken Yeo</text>
<text class="a body" x="48" y="558">also found the net for the Yellows.</text>
<text class="a body" x="48" y="601">Seven goals. A clean sheet. One memorable day.</text>
<line x1="24" y1="649" x2="696" y2="649" stroke="#cccccc"/>
<text class="a sm" x="24" y="688">SOURCE: TIVVY ARCHIVE · 1962/63 SEASON RECORDS</text>
<text class="a sm" x="24" y="716">tivvyarchive.co.uk/season.php?year=1962</text>
</svg>