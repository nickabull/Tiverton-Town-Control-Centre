function h(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function txt(x){return h(x).replace(/\n/g,'<br>')}function notice(x){return `<div class="notice">${x}</div>`}function group(title,body){return `<div class="group"><h3>${title}</h3>${body}</div>`}function input(key,label,value,rows=1){return `<label class="field"><strong>${h(label)}</strong>${rows>1?`<textarea rows="${rows}" data-edit="${h(key)}">${h(value)}</textarea>`:`<input data-edit="${h(key)}" value="${h(value)}">`}</label>`}function toast(s){const n=document.getElementById('toast');n.textContent=s;n.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>n.style.display='none',4000)}function persist(){model.meta.updated=new Date().toISOString();try{localStorage.setItem('tivvy-data-centre-v1',JSON.stringify(model));document.getElementById('saveState').textContent='SAVED IN THIS BROWSER · NOT CLOUD SYNCED'}catch{toast('Browser storage unavailable. Save a project backup.')}renderPreview()}

function nav(){const groups=[['editor','PROGRAMME PAGES',['overview','cover','p4','p6','report']],['data','AUTOMATIC DATA',['league','season','matrix']],['library','LIBRARY & PUBLISH',['assets','sources','publish']]];NAV.innerHTML=groups.map(([id,title,items])=>`<div class="navgroup"><button class="navhead" data-toggle="${id}" aria-expanded="${navGroupsOpen[id]}"><span>${title}</span><span>${navGroupsOpen[id]?'−':'+'}</span></button><div class="navitems" ${navGroupsOpen[id]?'':'hidden'}>${items.map(key=>{let item=sections.find(x=>x[0]===key);let [pid,num,label,sub]=item;return `<button class="tab ${pid===active?'active':''}" data-go="${pid}"><span class="number">${num}</span><span><b>${label}</b><small>${sub}</small></span></button>`}).join('')}</div></div>`).join('');NAV.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const k=b.dataset.toggle;navGroupsOpen[k]=!navGroupsOpen[k];nav()});NAV.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{active=b.dataset.go;render()})}

else if(active==='league')x+=`<h1>LEAGUE TABLE</h1><p class="muted">Table is calculated from a structured source, not hand-drawn boxes. Yellow Tivvy highlight follows club name.</p>${notice('DEMO DATA · 3 November 2026. Not connected to live Southern League standings. Do not publish without official cross-check.')}<button class="button" id="sortTable">Sort by points</button>`;
else if(active==='season')x+=`<h1>LEAGUE SO FAR</h1><p class="muted">One verified match creates one row. Keep source records independent of the visual page.</p>`+model.matches.map((m,i)=>group('MATCH '+(i+1),input(`matches.${i}.date`,'Date',m.date)+input(`matches.${i}.home`,'Home',m.home)+input(`matches.${i}.away`,'Away',m.away)+input(`matches.${i}.hs`,'Home goals',m.hs)+input(`matches.${i}.as`,'Away goals',m.as))).join('')+`<button class="button gold" id="addMatch">+ Add match row</button>`+notice('These are demonstration seed rows, not a complete season. Import the verified full-season records before publishing this page.');
else if(active==='matrix')x+=`<h1>LEAGUE MATRIX</h1><p class="muted">Generated from the same club and match records as League So Far.</p>${notice('Demo: currently only the three seeded matches have actual results. Blank cells are deliberately left unknown, never invented.')}<button class="button" data-open="season">Edit underlying matches</button>`;
else if(active==='report')x+=`<h1>LAST TIME OUT</h1><p class="muted">Paste Darren’s original writing once. Page count estimate updates automatically. Final print flow requires a typography check.</p>${input('report.title','Report title',model.report.title)}${input('report.byline','Byline',model.report.byline)}${input('report.text','Approved report text',model.report.text,18)}<label class="field"><strong>Match photograph</strong><input type="file" data-photo="report.image" accept="image/*"></label><p class="muted" id="reportInfo"></p>`;
else if(active==='assets')x+=`<h1>PHOTO LIBRARY</h1><p class="muted">Import a picture once and use it in multiple local page slots. Production version will save shared assets on the server.</p><label class="field"><strong>Add image to local library</strong><input type="file" accept="image/*" id="addAsset"></label>${model.media.map((m,i)=>`<div class="source"><b>${h(m.name)}</b><small>${h(m.credit||'Credit not entered')}</small><img class="imgasset" src="${m.data}"><label class="field"><strong>Photo credit</strong><input data-credit="${i}" value="${h(m.credit||'')}"></label><div class="toolbar"><button class="button" data-use="${i}:fixture.coverImage">Cover</button><button class="button" data-use="${i}:p6.photos.0">News left</button><button class="button" data-use="${i}:p6.photos.1">News right</button><button class="button" data-use="${i}:report.image">Match report</button></div></div>`).join('')}`;
else if(active==='sources')x+=`<h1>SOURCE CONNECTIONS</h1><p class="muted">Honest operational status. No fake green ticks for jobs that haven't been connected.</p>`+model.sources.map(s=>`<div class="source"><b>${h(s.name)}</b><small>${h(s.type)}</small><p class="danger">${h(s.state)}</p></div>`).join('')+notice('The automated Saturday/Tues/Wed schedule belongs in a real backend worker, with an audit log, source timestamps, retry/exception handling and verified official results. This standalone browser prototype cannot run unattended.');
else if(active==='publish')x+=`<h1>PUBLISH CENTRE</h1><p class="muted">The preview page can be printed as PDF or exported as a PNG. Saving project backup downloads editable data for recovery.</p>${group('WORKING LOCALLY','<p class="good">✓ Editing and live previews</p><p class="good">✓ Browser-local draft saving</p><p class="good">✓ Data backup and restore</p><p class="good">✓ Per-page print to PDF</p><p class="muted">PNG export uses the browser renderer; verify the resulting output.</p>')}${group('NOT CONNECTED YET','<p class="danger">○ Automatic fixtures / league feeds</p><p class="danger">○ GitHub / Wix publishing</p><p class="danger">○ X or social publishing</p><p class="danger">○ Scheduled background jobs</p><p class="danger">○ Full 56-page assembly</p>')}${notice('No external site or account is changed by this prototype.')}`;
E.innerHTML=x;E.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('input',()=>{let v=el.value;if(el.dataset.edit.endsWith('Form'))v=v.toUpperCase().replace(/[^WDL]/g,'').slice(-5);if(/\.hs$|\.as$/.test(el.dataset.edit))v=Number(v)||0;setPath(el.dataset.edit,v)}));E.querySelectorAll('[data-photo]').forEach(el=>el.addEventListener('change',()=>{let f=el.files[0];if(!f)return;if(f.size>3e6){toast('Please use images under 3MB in this standalone version.');return}let r=new FileReader;r.onload=()=>{setPath(el.dataset.photo,r.result);toast('Image assigned to page');};r.readAsDataURL(f)}));E.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{active=b.dataset.open;render()});E.querySelector('#addMatch')?.addEventListener('click',()=>{model.matches.push({date:model.fixture.date,home:'Tiverton Town',away:'',hs:0,as:0,competition:'League'});persist();render()});E.querySelector('#sortTable')?.addEventListener('click',()=>{model.standings.sort((a,b)=>b[2]-a[2]);persist();toast('Sorted by points in local draft')});E.querySelector('#addAsset')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.size>3e6){toast('Use images under 3MB');return}const r=new FileReader;r.onload=()=>{model.media.push({name:f.name,data:r.result,credit:''});persist();render()};r.readAsDataURL(f)});E.querySelectorAll('[data-credit]').forEach(b=>b.addEventListener('input',()=>{model.media[Number(b.dataset.credit)].credit=b.value;persist()}));E.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.use.split(':');setPath(k,model.media[Number(i)].data);toast('Image linked to page. It stays in local asset library.')});}
function matchesOfTown(){return model.matches.filter(m=>m.home==='Tiverton Town'||m.away==='Tiverton Town').sort((a,b)=>a.date.localeCompare(b.date))}function matchRow(m){const home=m.home==='Tiverton Town',gf=home?m.hs:m.as,ga=home?m.as:m.hs,res=gf>ga?'W':gf===ga?'D':'L';return `<tr><td>${h(m.date)}</td><td>${h(home?'H':'A')}</td><td>${h(home?m.away:m.home)}</td><td>${gf}–${ga}</td><td style="font-weight:700;color:${res==='W'?'#087536':res==='D'?'#b16b09':'#b93434'}">${res}</td></tr>`}
function matrix(){const rivals=model.standings.map(x=>x[0]).filter(n=>n!=='Tiverton Town');return rivals.map(name=>{const hit=model.matches.find(m=>(m.home==='Tiverton Town'&&m.away===name)||(m.away==='Tiverton Town'&&m.home===name));return `<div class="tile" style="min-height:78px"><h3>${h(name)}</h3><p>${hit?h(`${hit.home==='Tiverton Town'?'H':'A'} ${hit.home==='Tiverton Town'?hit.hs:hit.as}–${hit.home==='Tiverton Town'?hit.as:hit.hs}`):'–'}</p></div>`}).join('')}
function renderPreview(){if(active==='overview'||active==='sources'||active==='assets'||active==='publish'){const completed=3, total=56;V.innerHTML=`<div class="overview"><span class="eyebrow">Tivvy Data Centre / Operational view</span><h2>${active==='overview'?'THURSDAY MORNING':'SYSTEM STATUS'}</h2><div class="dashcards"><div class="dashcard"><b>${total}</b><small>Planned programme pages<br>Migration inventory pending</small></div><div class="dashcard"><b>${completed}</b><small>Working editable page templates<br>Cover · 60 seconds · News</small></div><div class="dashcard"><b>0</b><small>Live automated feed connections<br>Next integration stage</small></div></div><div class="task"><span style="font-size:24px">⚽</span><div><b>Next fixture: ${h(model.fixture.opposition)}</b><small>${h(model.fixture.date)} · ${h(model.fixture.kickoff)} · ${h(model.fixture.venue)}</small></div><span class="pill">LOCAL</span></div><div class="task"><span style="font-size:24px">📸</span><div><b>Cover photograph needs your choice</b><small>Select from your own images; shared Viv library integration pending</small></div><span class="pill">ACTION</span></div><div class="task"><span style="font-size:24px">📝</span><div><b>Darren's report</b><small>Approved copy and pagination to be checked</small></div><span class="pill">EDITORIAL</span></div><div class="task"><span style="font-size:24px">🔄</span><div><b>Unattended Saturday / midweek refreshes</b><small>Not running yet — backend and verified feeds required</small></div><span class="pill">BUILD</span></div>${notice('Working build, not the finished 56-page publishing system. No production data has been overwritten.')}</div>`;return}
let out='',ttl='';if(active==='cover'){ttl='FRONT COVER';out=`<div class="sheet" id="sheet"><div class="cover"><div class="swoosh"></div><img class="coverLogo" src="${LOGO}"><div class="face">${model.fixture.coverImage?`<img src="${model.fixture.coverImage}">`:'FEATURED PLAYER PHOTO<br>SELECT IN CONTROLS'}</div><div class="coverText"><h2>TIVERTON TOWN<br>VS<br>${h(model.fixture.opposition).toUpperCase()}</h2><h3>${h(model.fixture.date)} · ${h(model.fixture.kickoff)}<br>${h(model.fixture.venue).toUpperCase()}</h3>${model.fixture.opponentCrest?`<img src="${model.fixture.opponentCrest}" style="position:absolute;width:75px;right:0;bottom:8px">`:''}<p>FEATURED: ${h(model.fixture.player)}</p></div></div></div>`}
else if(active==='p4'){ttl='PAGE 04 · IN 60 SECONDS';out=shell('TODAY IN 60 SECS',`<div class="p4editorial"><h3 class="section">THE STORY</h3><p class="story">${txt(model.p4.story)}</p><div class="p4divider"></div><div class="p4three"><div class="p4panel"><h3>OUR FORM</h3><div class="dots">${dots(model.p4.ourForm)}</div><p>${h(model.p4.ours)}</p></div><div class="p4panel"><h3>THE VISITORS</h3><div class="dots">${dots(model.p4.visitorForm)}</div><p>${h(model.p4.visitors)}</p></div><div class="p4panel"><h3>WATCH FOR</h3><p>${h(model.p4.watch)}</p></div></div></div>`)}
else if(active==='p6'){ttl='PAGE 06 · LATEST NEWS';const groups=[0,1].map(c=>`<div>${[0,1,2].map(j=>{const i=c*3+j;return `<h3>${h(model.p6.heads[i])}</h3><p>${txt(model.p6.bodies[i])}</p>`}).join('')}</div>`).join('');out=shell('LATEST NEWS',`<div class="newsgrid">${groups}</div><div class="photos">${model.p6.photos.map((src,i)=>`<div>${src?`<img src="${src}">`:'<div style="background:#e6e6e6;height:120px;display:grid;place-items:center">CHOOSE PHOTO</div>'}<small>${h(model.p6.captions[i])}</small></div>`).join('')}</div>`,'WE WILL REMEMBER THEM')}
else if(active==='league'){ttl='PAGE 15 · LEAGUE TABLE · DEMO';out=shell('LEAGUE TABLE',`<p class="sourceTag">DEMO SNAPSHOT · OFFICIAL FEED NOT CONNECTED</p><table class="tabular"><thead><tr><th>POS</th><th>CLUB</th><th>P</th><th>PTS</th></tr></thead><tbody>${model.standings.map((r,i)=>`<tr class="${r[0]==='Tiverton Town'?'town':''}"><td>${i+1}</td><td>${h(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>`)}
else if(active==='season'){ttl='LEAGUE SO FAR · SOURCE ROWS';out=shell('LEAGUE SO FAR',`<p class="sourceTag">PARTIAL SAMPLE · NOT THE FULL SEASON</p><table class="tabular"><thead><tr><th>DATE</th><th>H/A</th><th>OPPOSITION</th><th>SCORE</th><th>RES</th></tr></thead><tbody>${matchesOfTown().map(matchRow).join('')}</tbody></table><p class="story" style="margin-top:20px">Every verified match is one reusable row. Pagination will be automatic when a full-season feed is connected.</p>`)}
else if(active==='matrix'){ttl='LEAGUE MATRIX · SOURCE RESULTS';out=shell('LEAGUE MATRIX',`<p class="sourceTag">PARTIAL SAMPLE · UNPLAYED/UNKNOWN ENTRIES LEFT BLANK</p><div class="grid3" style="margin-top:20px">${matrix()}</div>`)}
else if(active==='report'){ttl='LAST TIME OUT · EDITORIAL';const words=model.report.text.trim().split(/\s+/).length;const pageWords=380;const pages=Math.max(1,Math.ceil(words/pageWords));V.innerHTML=`<div class="topbar"><div><b>${ttl}</b><small>Estimated ${pages} text page${pages===1?'':'s'} · ${words} words · typography proof required</small></div></div>`;const paras=model.report.text.split(/\n\s*\n/).map(t=>`<p style="font:400 clamp(14px,1.7vw,20px) Antonio;line-height:1.45">${txt(t)}</p>`).join('');out=shell(model.report.title,`<p class="section">${h(model.report.byline)}</p>${model.report.image?`<img src="${model.report.image}" style="width:40%;float:right;margin:0 0 12px 15px">`:''}${paras}`)}
V.innerHTML=(active==='report'?V.innerHTML:`<div class="topbar"><div><b>${ttl}</b><small>Actual A4 proportions · editable layout · inspect final print proof</small></div><span class="chip">LOCAL DRAFT</span></div>`)+out}
function render(){nav();renderEditor();renderPreview()}document.getElementById('print').onclick=()=>{if(['overview','sources','assets','publish'].includes(active)){toast('Choose a programme page to print.');return}window.print()};document.getElementById('backup').onclick=()=>{const clean=JSON.stringify(model,null,2);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([clean],{type:'application/json'}));a.download='tivvy-data-centre-local-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Local project backup downloaded')};
document.getElementById('restore').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.fixture||!d.p4||!d.p6||!Array.isArray(d.matches)){throw Error('Invalid project structure')}if(!confirm('Replace this local draft with the selected backup?'))return;model=d;persist();render();toast('Local project restored from backup')}catch(e){toast('Invalid backup file. No changes made.')}};r.readAsText(f)};
document.getElementById('download').onclick=()=>{if(!document.getElementById('sheet')){toast('Choose a programme page for PNG export.');return}const sheet=document.getElementById('sheet').cloneNode(true);sheet.style.width='794px';sheet.style.height='1123px';const styles=[...document.styleSheets].map(s=>{try{return [...s.cssRules].filter(r=>!r.cssText.startsWith('@import')).map(r=>r.cssText).join('\n')}catch{return''}}).join('\n');const xml=new XMLSerializer().serializeToString(sheet);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${styles}</style>${xml}</div></foreignObject></svg>`;const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=2382;c.height=3369;const ctx=c.getContext('2d');ctx.scale(3,3);ctx.drawImage(im,0,0,794,1123);c.toBlob(blob=>{if(!blob){toast('Browser blocked PNG export. Try Print / PDF.');return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tivvy-'+active+'-page.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Page PNG exported — inspect font and resolution before printing.')},'image/png');URL.revokeObjectURL(url)};im.onerror=()=>{URL.revokeObjectURL(url);toast('Your browser blocked PNG conversion. Use Print / PDF instead.')};im.src=url};
render();</script></body></html>
