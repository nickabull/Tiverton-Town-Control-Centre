<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feature Slot | Tivvy Control Centre</title>
<style>
:root{--yellow:#f2c400;--bg:#e9e9e6;--ink:#151515;--line:#d7d7d1}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(115deg,#111 0%,#242424 45%,#111 100%);color:#fff;border-bottom:5px solid var(--yellow)}
.head{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.logo{height:58px;width:58px;object-fit:contain}.copy{flex:1}.copy b{display:block;color:var(--yellow);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.copy span{display:block;font-size:22px;font-weight:900;margin-top:3px}
nav a{display:inline-block;color:#fff;text-decoration:none;border:1px solid #555;border-radius:6px;padding:8px 10px;font-size:13px;margin-left:6px}
.controls{max-width:1180px;margin:20px auto 0;padding:0 20px}.bar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar strong{margin-right:4px}.bar select{padding:9px 10px;font:inherit}.bar button{padding:9px 12px;border:1px solid #222;background:var(--yellow);font-weight:800;cursor:pointer}.status{font-size:13px;color:#666}
.stage{padding:22px 16px 50px}.page{width:min(100%,720px);margin:auto;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:34px 36px 30px;min-height:1018px}
.kicker{font-size:12px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;color:#666}.mast{font-size:44px;line-height:.95;font-weight:1000;text-transform:uppercase;margin:5px 0 8px;letter-spacing:-1.4px}.deck{font-size:18px;font-weight:800;line-height:1.2;border-top:6px solid var(--yellow);padding-top:10px;margin-bottom:18px}.body{font-size:14px;line-height:1.48}.body h3{font-size:17px;text-transform:uppercase;margin:20px 0 8px}.body p{margin:7px 0}.body ul{margin:8px 0 0 18px;padding:0}.body li{margin:6px 0}.two{columns:2;column-gap:28px}.factgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.fact{background:#111;color:#fff;border-left:6px solid var(--yellow);padding:14px}.fact b{display:block;color:var(--yellow);font-size:28px}.fact span{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.quizq{margin:10px 0;padding-bottom:8px;border-bottom:1px solid #eee}.answerbox{margin-top:18px;background:#f5f5f2;border-left:5px solid var(--yellow);padding:12px}.placeholder{height:320px;border:2px dashed #bbb;display:flex;align-items:center;justify-content:center;text-align:center;color:#777;margin:18px 0}.footer{display:flex;justify-content:space-between;margin-top:24px;padding-top:9px;border-top:1px solid #ddd;font-size:10px;color:#777}.brand{font-weight:900;color:#111}
@media(max-width:760px){.page{min-height:0;padding:24px 22px}.mast{font-size:35px}.two{columns:1}.factgrid{grid-template-columns:1fr}}
@media print{body{background:#fff}.head,.controls{display:none}.stage{padding:0}.page{box-shadow:none;width:148mm;min-height:210mm;padding:12mm}}
</style></head>
<body>
<header><div class="head">
<img class="logo" src="https://ilcalcio.net/assets/74/79/74798e74ec395fe9614ced7aa31c4dc3.png" alt="Tiverton Town FC">
<div class="copy"><b>Tiverton Town Programme Builder</b><span>A5 Feature Slot Preview</span></div>
<nav><a href="index.html">Control Centre</a><a href="around-the-league.html">Around the League</a></nav>
</div></header>

<div class="controls"><div class="bar">
<strong>Preview feature:</strong>
<select id="pick">
<option>Around the League</option><option>Stat Attack</option><option>On This Day</option><option>Tivvy Quiz</option><option>Meet the Player</option><option>Who Am I?</option><option>Away Day Guide</option><option>From the Archive</option><option>Tivvy Teammates</option><option>Spot the Ball</option>
</select>
<button onclick="renderFeature()">Show preview</button>
<span class="status" id="status"></span>
</div></div>

<div class="stage"><main class="page" id="page"></main></div>

<script>
const features={
"Around the League":{
kicker:"Pitching In Southern League · Division One South",
mast:"Around the League",
deck:"Dorchester go top as comeback wins, late drama and a first league victory shape the weekend.",
body:`
<div class="two">
<h3>New leaders</h3><p><b>Swindon Supermarine 0–1 Dorchester Town</b><br>Dorchester climbed to the top after Ilya Ihnatenko struck in the 77th minute, moments after coming on.</p>
<h3>Five straight</h3><p><b>Bishops Cleeve 3–0 Melksham Town</b><br>Aaron Evans-Harriott, Jamal Lawrence and Adulai Sambu were on target as Cleeve made it five wins in a row.</p>
<h3>Tivvy share the points</h3><p><b>Tiverton Town 2–2 Worcester Raiders</b><br>Worcester led twice, with Aiden Horne and Finn Roberts replying for Tivvy in an action-packed first half.</p>
<h3>Late drama</h3><p><b>Bideford 1–2 Portland United</b><br>Harley Brook grabbed a dramatic 93rd-minute winner for Portland.</p>
<h3>Hartpury leave it late</h3><p><b>Hartpury 2–1 Barnstaple Town</b><br>Billy Osbourn struck in the 91st minute after Barnstaple had led early on.</p>
</div>`
},
"Stat Attack":{
kicker:"Tiverton Town · Current Season",
mast:"Stat Attack",
deck:"A quick-fire snapshot of Tivvy's latest league numbers.",
body:`
<div class="factgrid"><div class="fact"><b>15th</b><span>League position</span></div><div class="fact"><b>9</b><span>Points</span></div><div class="fact"><b>8</b><span>League games</span></div><div class="fact"><b>3–1</b><span>Latest result</span></div></div>
<h3>Recent league form</h3><p><b>L · L · D · D · W</b></p>
<h3>What this page will become</h3><p>The live version can automatically rotate in leading scorer, most starts, minutes leader, home/away record, clean sheets, unbeaten runs and unusual season milestones.</p>`
},
"On This Day":{
kicker:"Tivvy Archive",
mast:"On This Day",
deck:"A look back at Tiverton Town on this date in years gone by.",
body:`
<h3>7 October 2006</h3><p><b>Tiverton Town 1–1 Rugby Town</b></p>
<p>Tivvy were held to a draw in the Southern League Premier Division in front of a crowd of 434. Mike Booth was named man of the match.</p>
<h3>Why it works</h3><p>The programme builder will automatically search the Tivvy archive around the actual match date and pick the strongest historical story for that issue.</p>`
},
"Tivvy Quiz":{
kicker:"Supporter Challenge",
mast:"Tivvy Quiz",
deck:"Five questions. No phones. No excuses.",
body:`
<div class="quizq"><b>1.</b> Who did Tivvy beat 3–1 on Tuesday 6 October?</div>
<div class="quizq"><b>2.</b> What position are Tivvy currently in Division One South?</div>
<div class="quizq"><b>3.</b> Who are Tivvy away to on Saturday 10 October?</div>
<div class="quizq"><b>4.</b> Which current player returned to Tivvy in summer 2026 after first making his senior debut for the club at 16?</div>
<div class="quizq"><b>5.</b> What was the score when Tivvy hosted Rugby Town on 7 October 2006?</div>
<div class="answerbox"><b>Answers:</b> Hartpury · 15th · Shaftesbury · Owen Howe · 1–1</div>`
},
"Meet the Player":{
kicker:"Your Tivvy",
mast:"Meet the Player",
deck:"Owen Howe — the homegrown forward back in yellow and black.",
body:`
<h3>Player intro</h3><p>Owen Howe returned to Tivvy for 2026/27. He originally made his senior debut for the club at 16 and later scored 16 league goals in the 2016/17 promotion campaign.</p>
<h3>Quick fire</h3><ul><li>Best player you've played with?</li><li>Best ground you've played at?</li><li>Funniest teammate?</li><li>Favourite away day?</li><li>Pre-match meal?</li><li>One song on the dressing-room playlist?</li></ul>
<p><i>These answers are stored once the player supplies them, then reused whenever we select him for the feature.</i></p>`
},
"Who Am I?":{
kicker:"Tivvy Teaser",
mast:"Who Am I?",
deck:"Four clues. One Tivvy player. Can you get it before the final clue?",
body:`
<ul><li>I made my senior Tiverton debut aged 16.</li><li>I later had spells with Bideford and Willand.</li><li>I scored 16 league goals in Tivvy's 2016/17 promotion campaign.</li><li>I returned home for the 2026/27 season.</li></ul>
<div class="answerbox"><b>Answer:</b> Owen Howe</div>`
},
"Away Day Guide":{
kicker:"Next on the Road",
mast:"Away Day Guide",
deck:"Everything you need for Tivvy's trip to Shaftesbury.",
body:`
<h3>Shaftesbury · Saturday 10 October · 3pm</h3>
<p><b>Ground:</b> Cockrams, Coppice Street, Shaftesbury, Dorset, SP7 8PF.</p>
<p>The full version can automatically add travel time, parking, nearest station, admission, food and drink, recent form, Tivvy's previous visits and a short opposition snapshot.</p>
<h3>Programme note</h3><p>This feature would be ideal before a long or unusual away trip where supporters genuinely benefit from the information.</p>`
},
"From the Archive":{
kicker:"Tivvy History",
mast:"From the Archive",
deck:"A match, a memory and a little slice of Tivvy history.",
body:`
<h3>16 October 2010</h3><p><b>Bideford 4–2 Tiverton Town</b> · FA Trophy</p>
<p>Ian Sampson and Jamie Densham scored for Tivvy in front of 268.</p>
<div class="placeholder">Historic programme cover or archive photograph</div>
<p>Pairing one old image with a concise story gives us a strong heritage page without needing a full historical article every week.</p>`
},
"Tivvy Teammates":{
kicker:"Inside the Dressing Room",
mast:"Tivvy Teammates",
deck:"One player. Six questions. Absolutely no sitting on the fence.",
body:`
<h3>Question bank</h3><ul><li>Best trainer?</li><li>Worst dresser?</li><li>Funniest teammate?</li><li>Most likely to become a manager?</li><li>Last off the team bus?</li><li>Most questionable music taste?</li></ul>
<p>Once each player answers these once, we can store the responses and rotate this feature across the season.</p>`
},
"Spot the Ball":{
kicker:"Supporter Challenge",
mast:"Spot the Ball",
deck:"One Viv Curtis action shot. One missing football. Where was it?",
body:`
<div class="placeholder">Viv Curtis action photo goes here<br><br>Ball removed + A–F / 1–6 grid overlaid</div>
<p>The answer can appear in the next programme or be revealed on Tivvy social media, giving us a simple bridge between the printed programme and the club's online channels.</p>`
}
};

function renderFeature(){
 const name=document.getElementById('pick').value, f=features[name];
 localStorage.setItem('tivvyFeature',name);
 document.getElementById('status').textContent='Previewing: '+name;
 document.getElementById('page').innerHTML=
 '<div class="kicker">'+f.kicker+'</div><div class="mast">'+f.mast+'</div><div class="deck">'+f.deck+'</div><div class="body">'+f.body+'</div><div class="footer"><span>Programme feature preview</span><span class="brand">ONE TIVVY</span></div>';
}
const saved=localStorage.getItem('tivvyFeature');if(saved&&features[saved])document.getElementById('pick').value=saved;renderFeature();
</script>
</body></html>
