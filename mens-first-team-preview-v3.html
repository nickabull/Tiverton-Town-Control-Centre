<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Men's First Team V3 | Tiverton Town</title>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2c500;--ink:#141414;--grey:#eee;--red:#b92428}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#ffda00;color:var(--ink);font:15px/1.5 Arial,sans-serif}header{background:#ffda00;color:#111;border-bottom:0;padding:20px max(18px,calc((100vw - 1180px)/2)) 0}header .caps{font-size:14px;font-weight:700}header h1{background:#111;color:#ffda00;padding:12px 18px;margin-top:8px}header p{color:#111;border-bottom:4px solid #111;padding:9px 0 16px;font-weight:700}h1,h2,h3,.caps,.btn{font-family:Antonio,Impact,sans-serif;text-transform:uppercase}h1{font-size:clamp(34px,6vw,60px);margin:0;letter-spacing:1px}header p{margin:4px 0}.wrap{max-width:1180px;margin:auto;padding:22px 18px 70px}.notice{padding:11px 15px;background:#fff8d5;border-left:5px solid var(--gold);border-radius:5px;font-size:13px;margin-bottom:20px}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}.tools input,.tools select{font:inherit;padding:11px;border:2px solid #111;border-radius:0;background:#fff}.tools input{flex:1;min-width:200px}.tools select{min-width:160px}.section{margin:28px 0}.section h2{font-size:29px;background:#111;color:#ffda00;border-bottom:0;padding:12px 17px;margin:0 0 18px}.section h2 small{color:#ffda00!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:15px}.player{background:white;border:2px solid #111;border-radius:0;overflow:hidden;box-shadow:none}.player.loan{background:#fafafa}.player.departed{background:#e7e7e7;color:#5d5d5d}.top{min-height:113px;background:#111;padding:17px;color:#fff;display:flex;align-items:center;gap:12px}.initials{flex:none;width:59px;height:70px;display:grid;place-items:center;background:var(--gold);color:#101010;font:700 25px Antonio,sans-serif;border-radius:0}.player h3{font-size:24px;line-height:1.15;margin:0}.position{font-size:12px;opacity:.84;margin-top:6px}.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#d4d4d4;color:#222;border-radius:15px;padding:4px 8px;display:inline-block}.tag.loan{background:#fff0ac}.body{padding:14px}.sponsor{border:1px solid #ddd;background:#fff;min-height:52px;padding:9px 11px;border-radius:0;font-size:12px;margin-bottom:12px}.sponsor strong{display:block;font-family:Antonio;font-size:15px;text-transform:uppercase}.sponsor a{color:#222}.player details{border-top:1px solid #ddd}.player summary{font-family:Antonio;text-transform:uppercase;cursor:pointer;padding:12px 0;font-weight:700;font-size:16px;color:#111;list-style:none}.player summary:after{content:" + ";float:right}.player details[open] summary:after{content:" − "}.profile{font-size:13px}.profile p{margin:8px 0}.muted{color:#777}.empty{padding:22px;background:#fff;border-radius:7px}.foot{font-size:12px;color:#777;margin-top:24px}a{color:inherit}@media(max-width:650px){.wrap{padding:17px 12px 45px}.grid{grid-template-columns:1fr 1fr;gap:10px}.top{padding:11px;gap:9px;min-height:95px}.initials{width:39px;height:54px;font-size:19px}.player h3{font-size:18px}.body{padding:10px}.sponsor{font-size:11px}.tools select{min-width:120px}}@media(max-width:400px){.grid{grid-template-columns:1fr}}
 .player summary:hover{color:#b92428}.tools input:focus,.tools select:focus{outline:3px solid #111;outline-offset:2px}.top .initials{border:1px solid #111}.wrap{padding-top:14px}.section{margin-top:20px} @media(max-width:650px){header h1{font-size:34px;padding:11px}.tools input{min-width:100%;}.tools select{width:100%}}
.match-head{max-width:1180px;margin:0 auto;padding:10px 0 22px!important;display:flex;align-items:center;gap:24px;border-bottom:3px solid #111!important;background:transparent!important}.club-crest{width:90px;height:90px;object-fit:contain;flex-shrink:0}.match-title{flex:1}.match-head h1{background:transparent!important;color:#111!important;padding:0!important;margin:0!important;font:700 clamp(43px,5.5vw,68px)/1.13 Antonio,Impact,sans-serif!important;text-transform:none!important;letter-spacing:0!important}.match-head p{border:0!important;padding:0!important;margin:3px 0 0!important;font-size:18px;font-weight:700;color:#111!important}.wrap{padding-top:18px}@media(max-width:650px){.match-head{gap:13px;padding:10px 12px 16px!important}.club-crest{width:60px;height:60px}.match-head h1{font-size:clamp(29px,8vw,45px)!important}.match-head p{font-size:13px}} </style></head><body>
<header class="match-head"><img class="club-crest" src="https://static.wixstatic.com/media/8aa829_12ff4fae384b4477a4bf612ca24797b5~mv2.png" alt="Tiverton Town crest" onerror="this.style.display='none'"><div class="match-title"><h1>Tivvy First Team</h1><p>Players, Profiles &amp; Sponsors</p></div></header>
<main class="wrap"><div class="notice" hidden></div>
<div class="tools"><input id="search" type="search" placeholder="Search players…" aria-label="Search players"><select id="view" aria-label="View squad"><option value="current">Current first team</option><option value="loan">Players on loan</option><option value="departed">Former players</option><option value="all">All publishable players</option></select></div>
<div id="content" aria-live="polite">Loading player records…</div><p class="foot">Source: Tiverton Town Programme Centre player registry. Historical pre-season/trialist entries are deliberately excluded from this public view. Sponsor information is stored by season and will not overwrite prior-year records.</p></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':"&#39;"}[c]));
let players=[];const order=['Goalkeeper','Defender','Centre Back','Midfielder','Winger','Forward','Striker'];
const labels={current:'First-team squad',on_loan:'On loan',departed:'Former players'};
function statusClass(s){return s==='on_loan'?'loan':s==='departed'?'departed':''}
function card(p){const position=p.position||'Position to confirm',name=esc(p.name),s=p.sponsorships?.['2026/27']||{},club=p.current_club||'',sponsor=s.sponsor_name?.trim(),url=s.sponsor_url?.trim(),safeurl=url&&/^https:\/\//.test(url)?url:null;
const initials=p.name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
return '<article class="player '+statusClass(p.status)+'"><div class="top"><div class="initials" aria-hidden="true">'+esc(initials)+'</div><div><h3>'+name+'</h3><div class="position">'+esc(position)+'</div></div></div><div class="body">'+(p.status!=='current'?'<p><span class="tag '+statusClass(p.status)+'">'+esc(labels[p.status]||p.status)+'</span>'+(club?' · '+esc(club):'')+'</p>':'')+'<div class="sponsor"><strong>Sponsored by</strong>'+(sponsor?(safeurl?'<a target="_blank" rel="noopener" href="'+esc(safeurl)+'">'+esc(sponsor)+'</a>':esc(sponsor)):'Sponsorship available / to confirm')+'</div><details><summary>Player details</summary><div class="profile"><p><b>Position:</b> '+esc(position)+'</p>'+(p.summer_2026_tracking_club?'<p><b>Pre-season reference:</b> '+esc(p.summer_2026_tracking_club)+' <span class="muted">(historical; not necessarily current club)</span></p>':'')+(club?'<p><b>Current / loan club:</b> '+esc(club)+'</p>':'')+'<p class="muted">Match-by-match statistics and career history will link to the existing Match Centre profile when player identifiers are connected.</p></div></details></div></article>';}
function render(){const v=document.getElementById('view').value,q=document.getElementById('search').value.trim().toLowerCase();const selected=players.filter(p=>p.status!=='review'&&(v==='all'||p.status===(v==='loan'?'on_loan':v))&&p.name.toLowerCase().includes(q));selected.sort((a,b)=>(order.indexOf(a.position)<0?99:order.indexOf(a.position))-(order.indexOf(b.position)<0?99:order.indexOf(b.position))||a.name.localeCompare(b.name));document.getElementById('content').innerHTML='<section class="section"><h2>'+esc(v==='all'?'Player records':v==='loan'?'On loan':v==='departed'?'Former players':"Current first team")+' <small style="font-size:15px;color:#777">('+selected.length+')</small></h2>'+(selected.length?'<div class="grid">'+selected.map(card).join('')+'</div>':'<div class="empty">No matching players.</div>')+'</section>';}
document.getElementById('view').onchange=render;document.getElementById('search').oninput=render;
fetch('data/men-squad.json?v=20261102',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Roster unavailable');return r.json()}).then(d=>{players=d.players;render()}).catch(e=>{document.getElementById('content').textContent='Squad information is temporarily unavailable. Please try again later.';});
</script></body></html>
