ound:#d4d4d4;color:#222;border-radius:15px;padding:4px 8px;display:inline-block}.tag.loan{background:#fff0ac}.body{padding:14px}.sponsor{border:1px solid #ddd;background:#fff;min-height:52px;padding:9px 11px;border-radius:0;font-size:12px;margin-bottom:12px}.sponsor strong{display:block;font-family:Antonio;font-size:15px;text-transform:uppercase}.sponsor a{color:#222}.player details{border-top:1px solid #ddd}.player summary{font-family:Antonio;text-transform:uppercase;cursor:pointer;padding:12px 0;font-weight:700;font-size:16px;color:#111;list-style:none}.player summary:after{content:" + ";float:right}.player details[open] summary:after{content:" − "}.profile{font-size:13px}.profile p{margin:8px 0}.muted{color:#777}.empty{padding:22px;background:#fff;border-radius:7px}.foot{font-size:12px;color:#777;margin-top:24px}a{color:inherit}@media(max-width:650px){.wrap{padding:17px 12px 45px}.grid{grid-template-columns:1fr 1fr;gap:10px}.top{padding:11px;gap:9px;min-height:95px}.initials{width:39px;height:54px;font-size:19px}.player h3{font-size:18px}.body{padding:10px}.sponsor{font-size:11px}.tools select{min-width:120px}}@media(max-width:400px){.grid{grid-template-columns:1fr}}
 .player summary:hover{color:#b92428}.tools input:focus,.tools select:focus{outline:3px solid #111;outline-offset:2px}.top .initials{border:1px solid #111}.wrap{padding-top:14px}.section{margin-top:20px} @media(max-width:650px){header h1{font-size:34px;padding:11px}.tools input{min-width:100%;}.tools select{width:100%}}
.match-head{max-width:1180px;margin:0 auto;padding:10px 0 22px!important;display:flex;align-items:center;gap:24px;border-bottom:3px solid #111!important;background:transparent!important}.club-crest{width:90px;height:90px;object-fit:contain;flex-shrink:0}.match-title{flex:1}.match-head h1{background:transparent!important;color:#111!important;padding:0!important;margin:0!important;font:700 clamp(43px,5.5vw,68px)/1.13 Antonio,Impact,sans-serif!important;text-transform:none!important;letter-spacing:0!important}.match-head p{border:0!important;padding:0!important;margin:3px 0 0!important;font-size:18px;font-weight:700;color:#111!important}.wrap{padding-top:18px}@media(max-width:650px){.match-head{gap:13px;padding:10px 12px 16px!important}.club-crest{width:60px;height:60px}.match-head h1{font-size:clamp(29px,8vw,45px)!important}.match-head p{font-size:13px}} /* V4: Match Centre header proportions; keep entire crest inside iframe viewport. */
.match-head{display:block!important;box-sizing:border-box!important;width:100%!important;max-width:1180px!important;margin:0 auto!important;padding:14px 0 18px!important;border-bottom:3px solid #111!important;overflow:visible!important}

.club-crest{display:block!important;visibility:visible!important;width:90px!important;height:90px!important;max-width:90px!important;flex:0 0 90px!important;object-fit:contain!important;position:static!important;margin:0!important}

.match-head h1{font-family:'Antonio',Impact,'Arial Narrow',sans-serif!important;font-weight:700!important;font-size:clamp(42px,5.7vw,65px)!important;line-height:1.13!important;margin:0!important;padding:0!important;color:#111!important;background:none!important;letter-spacing:0!important;text-transform:none!important}
.match-head p{font-family:Arial,Helvetica,sans-serif!important;font-weight:700!important;font-size:18px!important;line-height:1.3!important;margin:4px 0 0!important;padding:0!important;color:#111!important}
@media(max-width:650px){.match-head{padding:10px 0 14px!important}.brand-row{gap:12px}.club-crest{width:62px!important;height:62px!important;max-width:62px!important;flex-basis:62px!important}.match-head h1{font-size:clamp(30px,7vw,45px)!important}.match-head p{font-size:13px!important}}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:10px 0 14px}.stats-grid>div{background:#111;color:#ffda00;text-align:center;padding:8px 1px}.stats-grid strong{display:block;font:700 25px Antonio,Impact,sans-serif}.stats-grid small{display:block;font:700 10px Arial,sans-serif;letter-spacing:.02em}.profile h4{margin:11px 0 6px;font:700 17px Antonio,sans-serif}.match-appearance{border-bottom:1px solid #ddd;padding:5px 0;font-size:12px}.player details[open]{animation:fadein .2s ease-out}@keyframes fadein{from{opacity:.65}to{opacity:1}}
.match-link{display:block;background:#b6252c;color:white;text-decoration:none;font:700 16px Antonio,Impact,sans-serif;padding:10px 12px;text-align:center}.match-link:hover{background:#111;color:#ffda00}.portrait{height:225px;background:linear-gradient(145deg,#202020,#393939);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.portrait-photo{display:block;width:100%;height:100%;object-fit:cover;object-position:center 23%}.portrait-initials{font:700 84px Antonio,Impact,sans-serif;color:#ffda00;line-height:1}.portrait-initials[hidden]{display:none}.portrait-photo[hidden]{display:none}.player .top{min-height:74px;padding:12px 16px;border-top:4px solid #ffda00;display:flex;justify-content:center;text-align:center;background:#111}.player .top h3{font-size:27px;color:white}.player .position{font-size:12px;color:#ffda00;opacity:1;text-transform:uppercase;font-weight:700;letter-spacing:.06em}.player{display:flex;flex-direction:column}.player>.body{flex:1;display:flex;flex-direction:column}.player details{margin-top:auto}.player.loan .portrait{filter:saturate(.72)}@media(max-width:650px){.portrait{height:190px}.portrait-initials{font-size:64px}.player .top{min-height:68px;padding:9px}.player .top h3{font-size:21px}}@media(max-width:400px){.portrait{height:245px}}
.sponsor{border:2px solid #111;background:#f7f7f7;min-height:65px}.sponsor strong{color:#111;letter-spacing:.03em}.sponsor-cta{display:block;padding:8px 10px;background:#ffda00;border:2px solid #111;color:#111!important;font:700 14px Antonio,Impact,sans-serif;text-transform:uppercase;text-align:center;text-decoration:none;line-height:1.3}.sponsor-cta:hover{background:#111;color:#ffda00!important}.sponsor a:not(.sponsor-cta){font-weight:700;text-decoration:underline;text-underline-offset:3px}.sponsor-cta:focus-visible{outline:3px solid #b92428;outline-offset:3px}</style></head><body>
<header class="match-head"><div class="brand-row"><img class="club-crest" src="https://ilcalcio.net/assets/74/79/74798e74ec395fe9614ced7aa31c4dc3.png" alt="Tiverton Town FC crest"><div class="match-title"><h1>Tivvy First Team</h1><p>Players, Profiles &amp; Sponsors</p></div></div></header>
<main class="wrap"><div class="notice" hidden></div>
<div class="tools"><input id="search" type="search" placeholder="Search players…" aria-label="Search players"><select id="view" aria-label="View squad"><option value="current">Current first team</option><option value="loan">Players on loan</option><option value="departed">Former players</option><option value="all">All publishable players</option></select></div>
<div id="content" aria-live="polite">Loading player records…</div><p class="foot">Source: Tiverton Town Programme Centre player registry. Historical pre-season/trialist entries are deliberately excluded from this public view. Sponsor information is stored by season and will not overwrite prior-year records.</p></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':"&#39;"}[c]));
const programmeBios={"Louis Smith":"Smith joined the Yellows ahead of the 2026/27 season following an impressive spell with Bridgwater United. A commanding goalkeeper with excellent shot-stopping ability, he is comfortable with the ball at his feet and brings confidence, leadership and composure to Tiverton’s defence.","Toby Stephens":"Starting his career in the Southampton and Yeovil Town academies, Toby went on to play for Plymouth Parkway and AFC Totton before joining Tivvy. After a spell in Australia, he returned to Devon. Toby enjoys getting on the ball, creating attacks and supporting the offence from deep.","Corey Koerner":"Koerner stayed with the Yellows after impressing in his first year at left back, having previously captained Yeovil Town youth sides. A versatile defender, he combines determination with composure in possession.","Louie Slough":"Having impressed at Bideford and developed in Torquay United’s youth team, Slough arrived as one of Asa Hall’s long-term transfer targets. Strong in the tackle and composed in possession, he is one of the club’s promising young defenders.","Dan Koita":"Dan brings energy and quality back to the Yellow and Black. After coming through at neighbouring Elmore, he played for Crediton United, Tavistock and Okehampton Argyle before scoring goals for Tivvy, including a memorable bicycle-kick winner in the M5 derby.","Asa Hall":"Hall combines his managerial duties with an influential midfield role. His experience includes more than 500 senior appearances and spells with Luton Town, Oxford United, Shrewsbury Town, Cheltenham Town and Torquay United.","Jacob Wellington":"Wellington continued into 2026/27 after winning the 2025/26 Young Player of the Year award. A hardworking and energetic midfielder, he contributes at both ends of the pitch.","Billy Tucker":"Tucker returned for another season after a career including spells with Bideford and Helston. Calm in possession and an intelligent reader of the game, he brings leadership, versatility and quality.","Jack Kennell":"Kennell extended his stay after establishing himself in the squad. A dependable midfielder, he combines work rate with tactical awareness and provides balance in the centre of the park.","Aiden Horne":"Horne continued with Tivvy after being named Supporters’ Player of the Year. He joined from nearby Cullompton and brings pace, direct running, energy and versatility to the forward line.","Owen Howe":"Howe returned to his hometown club ahead of 2026/27. An experienced Southern League striker, he combines intelligent movement, finishing and aerial ability.","Finn Roberts":"Roberts joined from Bideford ahead of 2026/27. An energetic young midfielder, he previously scored more than 12 goals in a season for Bideford from the left wing."};
let players=[],fixtures=[];const order=['Goalkeeper','Defender','Centre Back','Midfielder','Winger','Forward','Striker'];
const labels={current:'First-team squad',on_loan:'On loan',departed:'Former players'};
function statusClass(s){return s==='on_loan'?'loan':s==='departed'?'departed':''}
const playerPhotos=Object.create(null); // Add verified Wix portrait URLs here, keyed by player id.
function card(p){const position=p.position||'Position to confirm',name=esc(p.name),s=p.sponsorships?.['2026/27']||{},club=p.current_club||'',sponsor=s.sponsor_name?.trim(),url=s.sponsor_url?.trim(),safeurl=url&&/^https:\/\//.test(url)?url:null;
const initials=p.name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const photo=playerPhotos[p.id]||p.photo_url||'';
const safePhoto=photo&&/^https:\/\/static\.wixstatic\.com\/media\/[A-Za-z0-9_~.\-]+$/.test(photo)?photo:null;
const portrait=safePhoto?'<img class="portrait-photo" src="'+esc(safePhoto)+'" alt="Portrait of '+name+'" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="portrait-initials" hidden>'+esc(initials)+'</span>':'<span class="portrait-initials">'+esc(initials)+'</span>';
return '<article class="player '+statusClass(p.status)+'"><div class="portrait">'+portrait+'</div><div class="top"><div><h3>'+name+'</h3><div class="position">'+esc(position)+'</div></div></div><div class="body">'+(p.status!=='current'?'<p><span class="tag '+statusClass(p.status)+'">'+esc(labels[p.status]||p.status)+'</span>'+(club?' · '+esc(club):'')+'</p>':'')+'<div class="sponsor"><strong>'+(sponsor?'Sponsored by':'Player sponsorship')+'</strong>'+(sponsor?(safeurl?'<a target="_blank" rel="noopener" href="'+esc(safeurl)+'">'+esc(sponsor)+'</a>':esc(sponsor)):'<a class="sponsor-cta" href="mailto:Commercial@TivertonTownFC.uk?subject='+encodeURIComponent('Player sponsorship enquiry: '+p.name)+'">ENQUIRE ABOUT SPONSORING '+name+' ↗</a>')+'</div><details><summary>Player details</summary><div class="profile">'+statsFor(p.name)+'<p><b>Position:</b> '+esc(position)+'</p>'+(programmeBios[p.name]?'<h4>ABOUT '+name+'</h4><p>'+esc(programmeBios[p.name])+'</p>':'')+(p.summer_2026_tracking_club?'<p><b>Pre-season reference:</b> '+esc(p.summer_2026_tracking_club)+' <span class="muted">(historical; not necessarily current club)</span></p>':'')+(club?'<p><b>Current / loan club:</b> '+esc(club)+'</p>':'')+'<p class="muted">Match-by-match statistics and career history will link to the existing Match Centre profile when player identifiers are connected.</p></div></details></div></article>';}
function statsFor(name){
 let apps=0, starts=0, goals=0, bookings=0, recent=[];
 for(const f of fixtures){
  if(f.upcoming) continue;
  const full=[...(f.starterDetails||[]),...(f.subDetails||[])];
  let p=full.find(x=>x.name===name);
  if(!p){if((f.starters||[]).includes(name))p={sub:false,used:true};else if((f.subs||[]).includes(name))p={sub:true,used:false};}
  if(!p||p.used===false)continue;
  apps++;if(!p.sub)starts++;
  const count=Number(p.goalCount||(p.goalMinutes||[]).length||0);
  goals+=count;bookings+=(p.cards||[]).length;
  recent.push({date:f.date,venue:f.venue,opponent:f.opponent,goals:count});
 }
 recent.sort((a,b)=>b.date.localeCompare(a.date));
 if(!apps)return '<p class="muted">No confirmed appearances in the connected match data yet.</p>';
 return '<div class="stats-grid"><div><strong>'+apps+'</strong><small>APPS</small></div><div><strong>'+starts+'</strong><small>STARTS</small></div><div><strong>'+goals+'</strong><small>GOALS</small></div><div><strong>'+bookings+'</strong><small>CARDS</small></div></div><h4>LAST FIVE APPEARANCES</h4>'+recent.slice(0,5).map(x=>'<div class="match-appearance">'+esc(x.date.slice(8,10)+'/'+x.date.slice(5,7))+' · '+esc(x.opponent)+' ('+esc(x.venue)+')'+(x.goals?' · <b>'+x.goals+' goal'+(x.goals===1?'':'s')+'</b>':'')+'</div>').join('');
}
function render(){const v=document.getElementById('view').value,q=document.getElementById('search').value.trim().toLowerCase();const selected=players.filter(p=>p.status!=='review'&&(v==='all'||p.status===(v==='loan'?'on_loan':v))&&p.name.toLowerCase().includes(q));selected.sort((a,b)=>(order.indexOf(a.position)<0?99:order.indexOf(a.position))-(order.indexOf(b.position)<0?99:order.indexOf(b.position))||a.name.localeCompare(b.name));document.getElementById('content').innerHTML='<section class="section"><h2>'+esc(v==='all'?'Player records':v==='loan'?'On loan':v==='departed'?'Former players':"Current first team")+' <small style="font-size:15px;color:#777">('+selected.length+')</small></h2>'+(selected.length?'<div class="grid">'+selected.map(card).join('')+'</div>':'<div class="empty">No matching players.</div>')+'</section>';}
document.getElementById('view').onchange=render;document.getElementById('search').oninput=render;
Promise.all([fetch('data/men-squad.json',{cache:'no-store'}).then(r=>r.json()),fetch('https://raw.githubusercontent.com/nickabull/Tiverton-Town-Get-Player-Info/main/data.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({fixtures:[]}))]).then(([d,m])=>{players=d.players||[];fixtures=m.fixtures||[];render()}).catch(()=>{document.getElementById('content').textContent='Squad information is temporarily unavailable. Please try again later.';});
</script></body></html>
