/* Match the original Studio card coordinate system at its 850px design width. */
.cardStudio { width:850px; max-width:none; background:#fff; color:#101010; padding:28px 29px 32px; box-sizing:border-box; transform-origin:top left; }
.cardStudio .studioHero { position:relative; height:260px; margin-top:6px; isolation:isolate; background:#fff; overflow:visible; }
.cardStudio .studioBrush { position:absolute; inset:-35px -40px -25px -50px; width:calc(100% + 90px);height:calc(100% + 60px);object-fit:contain;object-position:center;z-index:0;transform-origin:center;pointer-events:none; }
.cardStudio .studioNameBar { position:relative; z-index:1; margin-top:49px; width:100%; min-height:90px; padding:0; }
.cardStudio .studioName { font:700 76px/1 Antonio,Impact,sans-serif;font-style:italic;text-transform:uppercase;white-space:nowrap;margin:0;letter-spacing:.3px; }

.cardStudio .studioPhoto { position:absolute;right:-29px;bottom:-15px;height:345px;max-width:none;object-fit:contain;object-position:bottom center;z-index:2;transform-origin:bottom right;pointer-events:none; }
.cardStudio .studioLower {position:relative;z-index:3;background:linear-gradient(145deg,#141414,#242424 55%,#161616);color:#fff;border:8px solid #ffd800;padding:15px 19px 20px;box-shadow:0 8px 24px #0004}

function selectGroup(group){
  const chosen=['goalkeepers','defenders','midfielders','attackers','former'].includes(group)?group:'goalkeepers';
  document.querySelectorAll('.squadTab').forEach(btn=>{
    const active=btn.dataset.group===chosen;
    btn.classList.toggle('active',active);
    btn.setAttribute('aria-pressed',String(active));
  });
  document.querySelectorAll('.positionGroup').forEach(section=>{
    section.hidden=(section.id!==(chosen==='former'?'formerSection':chosen));
  });
  requestAnimationFrame(fitCards);
}
document.querySelectorAll('.squadTab').forEach(button=>button.addEventListener('click',()=>selectGroup(button.dataset.group)));
function categoryFor(p){
 const role=String(p.position||'').trim().toLowerCase();
 const group=GROUPS.find(g=>g.description.some(word=>role.includes(word)));
 return group?.id||'midfielders';
}
function matchEvents(m){
 return (m.events||[]).map(e=>{
   const type=e?.type||'';
   const minute=safe(e?.minute||'');
   if(type==='goal')return '<span class="studioEventGoal">⚽ '+minute+'′</span>';
   if(type==='on')return '<span class="studioEventOn">▲ on '+minute+'′</span>';
   if(type==='off')return '<span class="studioEventOff">▼ off '+minute+'′</span>';
   return '';
 }).filter(Boolean).join(' · ');
}
function linkSafe(url){return /^https:\/\/[a-z0-9.-]+(?:\/|$)/i.test(String(url||''))?safe(url):'';}
function historyMarkup(p){
 const record=careerHistory[String(p.name||'').toLowerCase()];
 if(!record||!record.clubs?.length)return p.previous_club?'<p class="clubText">'+safe(p.previous_club)+'</p>':'<p class="noClubs">Not yet confirmed</p>';
 const list=record.clubs.map(item=>'<li><strong>'+safe(item.club)+'</strong>'+(item.period?' <span class="clubPeriod">'+safe(item.period)+'</span>':'')+(item.note?' <span class="clubNote">('+safe(item.note)+')</span>':'')+'</li>').join('');
 const sources=(record.sources||[]).filter(s=>linkSafe(s.url)).map(s=>'<a href="'+linkSafe(s.url)+'" target="_blank" rel="noopener noreferrer">'+safe(s.label)+'</a>');
 if(linkSafe(record.archiveUrl))sources.push('<a href="'+linkSafe(record.archiveUrl)+'" target="_blank" rel="noopener noreferrer">Tivvy Archive</a>');
 return '<ul class="clubList">'+list+'</ul>'+(sources.length?'<details class="clubSources"><summary>Sources ('+sources.length+')</summary><div>'+sources.join(' · ')+'</div></details>':'');
}
function matchMarkup(m){
 const code=String(m.result||'').match(/\b[WDL]\b/)?.[0]||'';
 const venue=String(m.venue||'').charAt(0).toUpperCase();
 const tag=venue==='H'?'H':venue==='A'?'A':'';
 const crest=linkSafe(verifiedOpponentCrest(m.opponent)||m.crest||'');
 const date=String(m.date||'').match(/^\d{4}-(\d{2})-(\d{2})$/);
 return '<div class="studioMatch">'+
   '<strong class="studioResult '+safe(code)+'">'+safe(code||'—')+'</strong>'+
   '<span class="studioDate">'+safe(date?date[2]+'/'+date[1]:m.date)+'</span>'+
   '<span class="studioOpponent">'+(crest?'<img class="matchCrest" src="'+crest+'" alt="" onerror="this.style.display=\'none\'">':'')+safe(m.opponent||'')+'</span>'+
   '<span class="studioVenue">'+safe(tag)+'</span>'+
   '<span class="studioIncidents">'+matchEvents(m)+'</span></div>';
}
function cardMarkup(p){
 const a=savedPlacements[p.id]||[-25,0,100,0,0,0,0,0,-20,200,0];
 const [photoX,photoY,photoScale,nameX,nameY,positionX,positionY,brushX,brushY,brushSize,panelY]=a;
 const stat=p.stats||{};
 const statFields=[['apps','APPS'],['starts','STARTS'],['goals','GOALS'],['minutes','MINS*'],['yellowCards','YELLOW'],['redCards','RED']];
 const stats=statFields.map(([k,l])=>'<div class="studioStat '+(k==='yellowCards'?'yellow':k==='redCards'?'red':'')+'"><strong>'+safe(stat[k]??'—')+'</strong><small>'+(k==='yellowCards'?'<i class="cardMarker yellow"></i>':k==='redCards'?'<i class="cardMarker red"></i>':'')+l+'</small></div>').join('');
 const matchRows=(p.matches||[]).slice(0,5).map(matchMarkup).join('')||'<p class="noClubs">Match details awaiting verification.</p>';

 const sponsor=String(p.confirmedSponsor||'').trim();
 const brush=(p.id==='louis-smith'?purple:yellow);
 const photoStyle='translate('+photoX+'px,'+photoY+'px) scale('+(photoScale/100)+')';
 const nameStyle='translate('+nameX+'px,'+nameY+'px)';
 const posStyle='translate('+positionX+'px,'+positionY+'px) skewX(-12deg)';
 const brushStyle='translate('+brushX+'px,'+brushY+'px) scale('+(brushSize/100)+')';
 return '<div class="cardViewport showcaseViewport"><article class="cardStudio">'+
 '<section class="studioHero">'+(p.id==='louis-smith'?'<img class="studioBrush" alt="" src="'+brush+'" style="transform:'+brushStyle+'">':'<span class="studioBrush exactYellowBrush" aria-hidden="true" style="--brush-url:url(&quot;'+brush+'&quot;);transform:'+brushStyle+'"></span>')+
 '<div class="studioNameBar" style="transform:'+nameStyle+'"><h2 class="studioName">'+safe(p.name)+'</h2></div>'+
 '<div class="studioPosition" style="transform:'+posStyle+'">'+pos+'</div>'+
 '<img class="studioPhoto" alt="" src="'+photos[p.id]+'" style="transform:'+photoStyle+'"></section>'+
 '<section class="studioLower" style="transform:translateY('+panelY+'px)"><div class="detailArea">'+
 '<div class="studioClubIdentity"><img src="'+tivvyCrest+'" alt="Tiverton Town crest"> TIVERTON TOWN · 2026/27</div><h3>PLAYER DETAILS</h3><div class="studioStatGrid">'+stats+'</div>'+
 '<div class="studioInfoGrid"><div class="infoMatches"><h3>LAST FIVE APPEARANCES</h3><div class="studioMatches">'+matchRows+'</div></div>'+
 '<div class="infoCareer"><h3>PREVIOUS CLUBS</h3>'+clubs+
 '<h3>SPONSOR</h3>'+(sponsor?'<p class="sponsorText">'+safe(sponsor)+'</p>':'<p class="noClubs">Sponsorship not listed</p>')+
 '<a class="playerLink" href="'+DATA_LINK+'" target="_blank" rel="noopener">MORE PLAYER STATS · MATCH CENTRE ↗</a></div></div>'+
 '</div></section></article></div>';
}
function addPlayer(p,container){
 const wrapper=document.createElement('article');
 wrapper.className='showcasePlayer'+(p.status==='departed'?' formerPlayer':'');
 wrapper.id='player-'+p.id;
 wrapper.innerHTML='<div class="playerControl"><span>'+safe(p.name)+'</span><button class="playerClose" type="button" aria-expanded="false">Show details +</button></div>'+cardMarkup(p);
 const button=wrapper.querySelector('.playerClose');
 button.addEventListener('click',()=>{
   const opening=!wrapper.classList.contains('expanded');
   wrapper.classList.toggle('expanded',opening);
   button.textContent=opening?'Close player ✕':'Show details +';
   button.setAttribute('aria-expanded',String(opening));
   fitCards();
 });
 container.appendChild(wrapper);
 return wrapper;
}
function fitCards(){
 document.querySelectorAll('.showcaseViewport').forEach(viewport=>{
   const element=viewport.querySelector('.cardStudio');
   if(!element)return;
   const factor=Math.min(1,viewport.clientWidth/850);
   element.style.transform='scale('+factor+')';
   const player=viewport.closest('.showcasePlayer');
   const lower=element.querySelector('.studioLower');
   const collapsedBottom=Math.max(0,lower.offsetTop-9);
   const fullHeight=Math.max(element.scrollHeight,lower.offsetTop+lower.offsetHeight+36);
   viewport.style.height=Math.ceil((player?.classList.contains('expanded')?fullHeight:collapsedBottom)*factor+3)+'px';
 });
}
window.addEventListener('resize',fitCards);
Promise.all([fetch('data/men-squad.json').then(r=>r.json()),fetch('https://raw.githubusercontent.com/nickabull/Tiverton-Town-Get-Player-Info/main/data.json').then(r=>r.json())]).then(([s,d])=>{let fs=d.fixtures||[];function compute(name){let apps=0,starts=0,goals=0,minutes=0,yellowCards=0,redCards=0,matches=[];for(const f of fs){if(f.upcoming)continue;let x=[...(f.starterDetails||[]),...(f.subDetails||[])].find(z=>z.name===name);if(!x||x.used===false)continue;apps++;if(!x.sub)starts++;const n=v=>{const q=String(v||'').match(/^(\d+)(?:\+(\d+))?/);return q?Number(q[1])+Number(q[2]||0):null};const on=x.sub?n(x.onMinute):0,off=n(x.offMinute)??90;if(on!==null)minutes+=Math.max(0,off-on);goals+=Number(x.goalCount||0);for(const card of x.cards||[]){if(/yellow/i.test(card.type||''))yellowCards++;if(/red|sending_off/i.test(card.type||''))redCards++}matches.push({date:f.date,opponent:f.opponent,crest:f.opponentLogoUrl||'',venue:f.venue,result:(()=>{const score=String(f.result||'').match(/^(\d+)\s*[-–:]\s*(\d+)$/);return !score?'':Number(score[1])>Number(score[2])?'W':Number(score[1])<Number(score[2])?'L':'D'})(),events:[...(x.goalMinutes||[]).map(t=>({type:'goal',minute:t})),...(x.sub&&x.onMinute?[{type:'on',minute:x.onMinute}]:[]),...(x.offMinute?[{type:'off',minute:x.offMinute}]:[])]})}matches.sort((a,b)=>b.date.localeCompare(a.date));return{stats:{apps,starts,goals,minutes,yellowCards,redCards},matches:matches.slice(0,5)}};const mount=document.getElementById('groups');
 const regions={};
 for(const group of GROUPS){
   const section=document.createElement('section');
   section.className='positionGroup';

   section.innerHTML='<h2 class="groupTitle">'+group.title+' <span class="groupCount" id="count-'+group.id+'"></span></h2><div class="groupCards"></div>';
   mount.appendChild(section);
   regions[group.id]=section.querySelector('.groupCards');
 }
 const counts=Object.fromEntries(GROUPS.map(g=>[g.id,0]));
 for(const p of s.players||[]){
   if(!photos[p.id])continue;
   const saved=editorial[p.id]||[];
   const z={...p,...compute(p.name),position:saved[0]||p.position||'Position to confirm',previous_club:saved[1]||p.previous_club||'',confirmedSponsor:saved[2]||p.sponsorships?.['2026/27']?.sponsor_name||''};
   if(['ed-palmer','lewis-flowers'].includes(p.id)){
     z.status='departed';
     addPlayer(z,document.getElementById('formerCards'));
   }else if(!['caleb-price-hall','caleb-pryce-hall','finn-hodge'].includes(p.id)&&p.status!=='on_loan'&&p.status!=='departed'){
     const category=categoryFor(z);
     counts[category]++;
     addPlayer(z,regions[category]);
   }
 }
 for(const group of GROUPS)document.getElementById('count-'+group.id).textContent='('+counts[group.id]+')';
 for(const [id,n] of Object.entries({...counts,former:document.querySelectorAll('#formerCards .showcasePlayer').length})){
   const badge=document.querySelector('.squadTab [data-count="'+id+'"]');
   if(badge)badge.textContent='('+n+')';
 }
 selectGroup('goalkeepers');
 requestAnimationFrame(fitCards);
}).catch(e=>{const note=document.querySelector('.showcaseNote');if(note)note.textContent='Preview data unavailable: '+e.message;})
