:root{--y:#ffd800}*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:15px Arial}h1,h2,h3,.name,.pos,.stat,.btn{font-family:Antonio,Impact,sans-serif;text-transform:uppercase}header{padding:26px max(20px,calc((100vw - 1240px)/2));background:#050505;border-bottom:5px solid var(--y)}h1{font-size:52px;margin:0}header small{color:#bbb}.wrap{max-width:1240px;margin:auto;padding:22px}.note{border-left:4px solid var(--y);padding:12px;background:#242424;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.tile{padding:0;background:#fff;color:#111;border:2px solid #333;cursor:pointer;text-align:left;overflow:hidden}.tile:hover{border-color:var(--y)}.tile .art{position:relative;height:220px;background:#f9f9f9;overflow:hidden}.tile .sw{position:absolute;inset:-10%;width:120%;height:120%;object-fit:contain}.tile .face{position:absolute;max-width:90%;height:95%;bottom:0;right:0;object-fit:contain;object-position:bottom}.tile.left .face{right:auto;left:0}.tile .txt{background:#111;color:white;padding:9px 13px}.name{font-size:27px}.tile .pos{font-size:15px;color:var(--y)}h2{font-size:32px;margin:20px 0 12px}.former{filter:grayscale(1);opacity:.7}button{font:inherit}.btn{padding:12px 20px;background:var(--y);border:0;cursor:pointer;font-size:20px}dialog{border:0;padding:0;background:#fff;color:#111;width:min(94vw,900px);max-height:94vh;overflow:auto}dialog::backdrop{background:#000c}.close{position:sticky;top:0;float:right;z-index:9;border:0;background:#c22;color:#fff;padding:10px 16px;cursor:pointer;font:700 18px Arial}.hero{height:345px;position:relative;overflow:hidden;background:#fff}.hero .sw{position:absolute;inset:-12%;width:125%;height:125%;object-fit:contain}.hero .face{position:absolute;right:0;bottom:0;height:100%;max-width:62%;object-fit:contain;object-position:bottom}.hero.left .face{left:0;right:auto}.hero .identity{position:absolute;top:85px;left:40px;max-width:70%;z-index:2}.hero.left .identity{left:auto;right:25px}.hero h2{font-size:clamp(46px,7vw,82px);line-height:1;margin:0 0 12px;font-style:italic}.hero .pos{display:inline-block;background:#111;color:white;padding:9px 18px;transform:skewX(-10deg);font-size:30px}.lower{background:#161616;color:#fff;border:8px solid var(--y);padding:22px}.lower h3{color:var(--y);font-size:27px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{background:#fff;color:#111;text-align:center;padding:10px 3px}.stat b{font-size:31px;display:block}.stat small{font-size:13px}.matches{margin:14px 0}.match{border-bottom:1px solid #555;padding:8px 0;display:flex;justify-content:space-between;gap:8px}.match strong.W{color:#42c46b}.match strong.D{color:#f4a33c}.match strong.L{color:#fa6969}.extra{margin-top:20px;display:none}@media(max-width:650px){.wrap{padding:12px}.stats{grid-template-columns:repeat(3,1fr)}.hero{height:270px}.hero .identity{top:65px;left:15px}.hero.left .identity{right:10px}.hero h2{font-size:42px}.hero .pos{font-size:22px}.lower{padding:10px;border-width:5px}}
</style><header><h1>TIVVY PLAYER CARDS</h1><small>Private design preview · 2026/27 · not linked from the public navigation</small></header><main class="wrap"><div class="note">PREVIEW ONLY — current figures are subject to final verification. Biographies omitted as agreed. Select any player to see the full black-and-gold card.</div><h2>First Team</h2><section id="grid" class="grid"></section><h2>Former Players</h2><section id="former" class="grid"></section></main><dialog id="detail"><button class="close" onclick="document.getElementById('detail').close()">✕ Close</button><div id="card"></div></dialog><script>
const photos={"aaron-wellington":"https://static.wixstatic.com/media/8aa829_341ebcb77e794cd2b0fe7534293a6c2d~mv2.png","aiden-horne":"https://static.wixstatic.com/media/8aa829_012f1fbb61014842b6a897ea8efb7446~mv2.png","asa-hall":"https://static.wixstatic.com/media/8aa829_37b4ea236d174d5a90824e7d396ee1f1~mv2.png","billy-tucker":"https://static.wixstatic.com/media/8aa829_72a3e03e9f8e49b29a83633bbb4bf11e~mv2.png","corey-koerner":"https://static.wixstatic.com/media/8aa829_b76b9523565343d99d3301c915aa4977~mv2.png","dan-koita":"https://static.wixstatic.com/media/8aa829_1f5a4cedd9e043dbae78b14dc7db3c9d~mv2.png","ed-palmer":"https://static.wixstatic.com/media/8aa829_1b54df80b2c94ae2a906bdf9851d15f8~mv2.png","finn-hodge":"https://static.wixstatic.com/media/8aa829_f4b68ebbbf01431daec2f0164f1f9430~mv2.png","finn-roberts":"https://static.wixstatic.com/media/8aa829_ae75aa2346974e80946c94cd679f3791~mv2.png","jack-kennell":"https://static.wixstatic.com/media/8aa829_e48c892b583f4b76b20703891c56ff4f~mv2.png","jacob-wellington":"https://static.wixstatic.com/media/8aa829_79191ea70db34e93897042ac05f18685~mv2.png","josh-bissett":"https://static.wixstatic.com/media/8aa829_3d1548970ffb40b5ae8b97b5b6fb193f~mv2.png","karim-coulibaly":"https://static.wixstatic.com/media/8aa829_256e163a46014a26beef49ef434ac967~mv2.png","louie-slough":"https://static.wixstatic.com/media/8aa829_6684a7b2e03c4b299c56ec07291bf83d~mv2.png","louis-jagger-cane":"https://static.wixstatic.com/media/8aa829_6e9c403d1b0b465ea12d55eab1ae2e88~mv2.png","louis-smith":"https://static.wixstatic.com/media/8aa829_b1be1b6074694a0ca185d115564c7e52~mv2.png","mason-winter":"https://static.wixstatic.com/media/8aa829_6fc4a5a9d42144d488e87046a3b34adb~mv2.png","matt-wood":"https://static.wixstatic.com/media/8aa829_8289ed63195e4553a0dfffd918ce04f0~mv2.png","owen-howe":"https://static.wixstatic.com/media/8aa829_e6b7e0879c31459c8705b8af6de9ce4b~mv2.png","ryan-keates":"https://static.wixstatic.com/media/8aa829_a93fe520111741d5998d0737ff3499d0~mv2.png","tobias-alsop":"https://static.wixstatic.com/media/8aa829_8cc51513e6744f85997af6914de5dcc8~mv2.png","toby-stephens":"https://static.wixstatic.com/media/8aa829_aee9bfe88b324647a64023f388be7c85~mv2.png"};
const yellow="https://static.wixstatic.com/media/8aa829_577ea00227df4e88a88a3b109b717166~mv2.png",purple="https://static.wixstatic.com/media/8aa829_81efb7b2c16545dd9be6c263ddacfeae~mv2.png";
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function cell(p){let left=['matt-wood','jacob-wellington'].includes(p.id),g=p.id==='louis-smith';let article=document.createElement('button');article.className='tile'+(left?' left':'')+(p.status==='departed'?' former':'');article.innerHTML='<div class="art"><img class="sw" src="'+(g?purple:yellow)+'"><img class="face" src="'+photos[p.id]+'"></div><div class="txt"><div class="name">'+safe(p.name)+'</div><div class="pos">'+safe(p.position||'First Team')+'</div></div>';article.onclick=()=>show(p,left,g);return article}
function show(p,left,g){const stat=p.stats||{};const keys=[['apps','APPS'],['starts','STARTS'],['goals','GOALS'],['minutes','MINS*'],['yellowCards','YELLOW'],['redCards','RED']];const stats=keys.map(([k,l])=>'<div class="stat"><b>'+safe(stat[k]??'—')+'</b><small>'+l+'</small></div>').join('');const matches=(p.matches||[]).slice(0,5).map(m=>'<div class="match"><span>'+safe(m.date)+' · '+safe(m.opponent)+'</span><span>'+safe(m.venue)+'</span><strong class="'+safe(m.result)+'">'+safe(m.result)+'</strong></div>').join('')||'<p>Match records to be verified.</p>';document.getElementById('card').innerHTML='<div class="hero '+(left?'left':'')+'"><img class="sw" src="'+(g?purple:yellow)+'"><div class="identity"><h2>'+safe(p.name)+'</h2><div class="pos">'+safe(p.position||'First Team')+'</div></div><img class="face" src="'+photos[p.id]+'"></div><div class="lower"><h3>PLAYER DETAILS</h3><div class="stats">'+stats+'</div><h3>LAST FIVE MATCHES</h3><div class="matches">'+matches+'</div>'+(p.previous_club?'<h3>PREVIOUS CLUBS</h3><p>'+safe(p.previous_club)+'</p>':'')+'</div>';document.getElementById('detail').showModal()}
Promise.all([fetch('data/men-squad.json').then(r=>r.json()),fetch('https://raw.githubusercontent.com/nickabull/Tiverton-Town-Get-Player-Info/main/data.json').then(r=>r.json())]).then(([s,d])=>{let fs=d.fixtures||[];function compute(name){let apps=0,starts=0,goals=0,minutes=0,yellowCards=0,redCards=0,matches=[];for(const f of fs){if(f.upcoming)continue;let x=[...(f.starterDetails||[]),...(f.subDetails||[])].find(z=>z.name===name);if(!x||x.used===false)continue;apps++;if(!x.sub)starts++;const n=v=>{const q=String(v||'').match(/^(\d+)(?:\+(\d+))?/);return q?Number(q[1])+Number(q[2]||0):null};const on=x.sub?n(x.onMinute):0,off=n(x.offMinute)??90;if(on!==null)minutes+=Math.max(0,off-on);goals+=Number(x.goalCount||0);for(const card of x.cards||[]){if(/yellow/i.test(card.type||''))yellowCards++;if(/red|sending_off/i.test(card.type||''))redCards++}matches.push({date:f.date,opponent:f.opponent,venue:f.venue,result:f.result||''})}matches.sort((a,b)=>b.date.localeCompare(a.date));return{stats:{apps,starts,goals,minutes,yellowCards,redCards},matches:matches.slice(0,5)}};for(const p of s.players||[]){if(!photos[p.id])continue;const z={...p,...compute(p.name)};if(['ed-palmer','lewis-flowers'].includes(p.id)){z.status='departed';document.getElementById('former').appendChild(cell(z))}else if(!['caleb-price-hall','caleb-pryce-hall','finn-hodge'].includes(p.id)&&p.status!=='on_loan'&&p.status!=='departed'){document.getElementById('grid').appendChild(cell(z))}}}).catch(e=>document.querySelector('.note').textContent='Preview data unavailable: '+e.message)
</script></html>
