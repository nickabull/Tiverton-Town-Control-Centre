<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Around the League | Tiverton Town FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--yellow:#ffdd00;--black:#111}*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:#111;font-family:Arial,Helvetica,sans-serif}
.widget{width:100%;background:var(--yellow);border:2px solid #111}
.head{background:#111;padding:19px 22px;color:var(--yellow)}
h1{font:700 clamp(27px,3vw,37px)/1.1 Antonio,Impact,'Arial Narrow',sans-serif;margin:0}
.strip{background:var(--yellow);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 19px Antonio,Impact,'Arial Narrow',sans-serif}
.strip small{font:700 15px Antonio,Impact,sans-serif}
.datebar{background:var(--yellow);padding:0 20px 11px;font-size:14px}
.list{background:var(--yellow)}
.game{display:grid;grid-template-columns:115px minmax(185px,1.18fr) 140px 70px minmax(205px,1.42fr);align-items:center;gap:11px;padding:19px 18px;min-height:142px;border-top:1px solid #111}
.game:nth-child(even){background:#fff}
.crest{width:104px;height:104px;object-fit:contain;display:block}
.crest-fallback{width:104px;height:104px;display:grid;place-items:center;font:700 12px Antonio,sans-serif;text-align:center;border:2px solid #111}
.detail{display:flex;flex-direction:column;justify-content:space-between;align-self:stretch;gap:9px;padding:8px 0}
.date{font-size:21px;font-weight:700}
.homeName{font:700 clamp(16px,1.7vw,22px)/1.1 Arial,sans-serif}
.meta{line-height:1.28;font-size:17px;align-self:end;padding-bottom:8px}
.meta strong{font-size:18px;display:block}
.score{text-align:center;font:700 29px/1.1 Arial,sans-serif}
.kickoff{display:block;font:14px Arial,sans-serif;margin-top:7px}
.awayName{font:700 clamp(20px,2.3vw,30px)/1.18 Arial,sans-serif;overflow-wrap:anywhere}
 .team a,.team a:visited{color:#111;text-decoration:none}
.team a:hover,.team a:focus-visible{text-decoration:underline;text-underline-offset:4px}
.foot{background:#111;color:#ddd;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 20px;font-size:12px}
.foot a{font:700 16px Antonio,Impact,sans-serif;color:var(--yellow);text-decoration:none}
.message{padding:22px;background:var(--yellow);text-align:center}
@media(max-width:900px){.game{grid-template-columns:80px minmax(140px,1fr) 97px 48px minmax(120px,1.25fr);gap:8px;min-height:119px;padding:13px 12px}.crest,.crest-fallback{width:73px;height:73px}.date{font-size:17px}.meta,.meta strong{font-size:14px}.homeName{font-size:16px}.awayName{font-size:20px}.score{font-size:24px}}
@media(max-width:600px){.head{padding:14px}.strip{padding:10px 9px;font-size:15px}.strip small{font-size:12px}.datebar{padding:0 9px 10px;font-size:12px}.game{grid-template-columns:56px minmax(0,1.1fr) 47px minmax(0,1.15fr);gap:7px;min-height:91px;padding:10px 7px}.crest,.crest-fallback{width:53px;height:53px}.detail{padding:2px 0;gap:6px}.date{font-size:13px}.homeName{font-size:13px}.meta{display:none}.score{font-size:21px}.kickoff{font-size:10px;margin-top:3px}.awayName{font-size:14px}.foot{padding:12px}}
</style></head><body>
<section class="widget" aria-label="Other Southern League Division One South fixtures">
<header class="head"><div class="headCopy"><h1>AROUND THE LEAGUE</h1></div></header><div class="datebar" id="matchDate">Checking the next matchday…</div>
<div class="strip"><span id="stripTitle">OTHER LEAGUE FIXTURES</span><small id="stripCount"></small></div>
<div class="list" id="fixtures" aria-live="polite"><div class="message">Loading league fixtures…</div></div>
<footer class="foot"><span id="source">Football Web Pages · League data</span><a href="https://www.southern-football-league.co.uk/overview/divonesouth" target="_blank" rel="noopener noreferrer">FULL FIXTURE LIST ↗</a></footer>
</section>
<script>
(function(){
"use strict";
var list=document.getElementById("fixtures"), dateEl=document.getElementById("matchDate");
var titleEl=document.getElementById("stripTitle"), countEl=document.getElementById("stripCount");
var script=document.createElement("script"),received=false;
function londonToday(){
 var pieces=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 var o={};pieces.forEach(function(p){o[p.type]=p.value;});return o.year+"-"+o.month+"-"+o.day;
}
function dateLabel(d){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{timeZone:"Europe/London",weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function isSaturday(d){return new Date(d+"T12:00:00Z").getUTCDay()===6;}
var clubProfiles={
 "bideford":"bideford-afc","bideford afc":"bideford-afc","larkhall athletic":"larkhall-athletic",
 "bristol manor farm":"bristol-manor-farm","willand rovers":"willand-rovers",
 "exmouth town":"exmouth-town","paulton rovers":"paulton-rovers",
 "hungerford town":"hungerford-town","worcester raiders":"wors-raiders",
 "melksham town":"melksham-town","falmouth town":"falmouth-town",
 "portland united":"portland-utd","portland utd":"portland-utd","hartpury":"hartpury",
 "shaftesbury":"Shaftesbury%20FC","shaftesbury fc":"Shaftesbury%20FC","barnstaple town":"barnstaple-town",
 "slimbridge":"Slimbridge","slimbridge afc":"Slimbridge",
 "weymouth":"weymouth","weymouth fc":"weymouth",
 "westbury united":"westbury-united","dorchester town":"dorchester-town",
 "bishops cleeve":"bishops-cleeve","bishop's cleeve":"bishops-cleeve",
 "sporting club inkberrow":"sporting-club-inkberrow","swindon supermarine":"swindon-supermarine",
 "tiverton town":"tiverton-town"
};
function teamLink(team,side){
 var outer=document.createElement("div");outer.className="team "+side;
 var key=String(team||"").trim().toLowerCase().replace(/\s+/g," ");
 var slug=clubProfiles[key];
 if(slug){
  var a=document.createElement("a");
  a.href="https://www.southern-football-league.co.uk/clubs/"+slug;
  a.target="_blank";a.rel="noopener noreferrer";
  a.title="View "+team+" on the Southern League website (opens new tab)";
  a.textContent=team;
  outer.append(a);
 }else{outer.textContent=team;}
 return outer;
}
var crestMap={
 "barnstaple town":"barnstapletown","bideford":"bideford","bideford afc":"bideford",
 "bishops cleeve":"bishopscleeve","bishop's cleeve":"bishopscleeve",
 "bristol manor farm":"bristolmanorfarm","dorchester town":"dorchestertown",
 "exmouth town":"exmouthtown","falmouth town":"falmouthtown","hartpury":"hartpury",
 "hungerford town":"hungerfordtown","larkhall athletic":"larkhallathletic",
 "melksham town":"melkshamtown","paulton rovers":"paultonrovers",
 "portland united":"portlandunited","shaftesbury":"shaftesbury","slimbridge":"slimbridge",
 "sporting club inkberrow":"scinkberrow","swindon supermarine":"swindonsupermarine",
 "tiverton town":"tivertontown","westbury united":"westburyunited",
 "weymouth":"weymouth","willand rovers":"willandrovers",
 "worcester raiders":"worcesterraiders"
};
function crestFor(team){
 var key=String(team||"").toLowerCase().trim().replace(/\s+/g," ");
 var name=crestMap[key];
 if(!name)return null;
 return "https://nickabull.github.io/Tiverton-Town-Get-Player-Info/assets/locked-crests/"+name+".png";
}
function dateShort(d){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"Europe/London"});}
function renderMessage(t){list.replaceChildren();var el=document.createElement("div");el.className="message";el.textContent=t;list.append(el);}
window.tivvyFixturesReady=function(data){
 received=true;if(!data||data.success!==true||!Array.isArray(data.fixtures)){renderMessage("Fixture feed temporarily unavailable.");return;}
 var today=londonToday();
 var all=data.fixtures.filter(function(m){return m&&/^\d{4}-\d{2}-\d{2}$/.test(m.date)&&isSaturday(m.date)&&m.date>=today&&!/tiverton/i.test((m.home||"")+" "+(m.away||""));});
 all.sort(function(a,b){return a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||"");});
 var matchday=all.length?all[0].date:null;
 if(!matchday){dateEl.textContent="No upcoming Saturday fixtures currently listed";renderMessage("Please check the Southern League fixtures page.");return;}
 var games=all.filter(function(m){return m.date===matchday;});
 dateEl.textContent=dateLabel(matchday)+" · Excluding Tiverton Town";
 var finished=games.filter(function(m){return /^(FT|AET|PEN)$/i.test(m.status||"");}).length;
 titleEl.textContent=finished===games.length?"MATCHDAY RESULTS":finished>0?"FIXTURES & RESULTS":"OTHER LEAGUE FIXTURES";
 countEl.textContent=games.length+" MATCH"+(games.length===1?"":"ES");
 list.replaceChildren();
 games.forEach(function(m){
  var row=document.createElement("div");row.className="game";
  var logo=crestFor(m.home);
  var badge=logo?document.createElement("img"):document.createElement("div");
  if(logo){badge.src=logo;badge.alt=m.home+" crest";badge.loading="lazy";badge.className="crest";}
  else{badge.className="crest-fallback";badge.textContent=m.home;}
  var detail=document.createElement("div");detail.className="detail";
  var date=document.createElement("div");date.className="date";date.textContent=dateShort(m.date);
  var home=teamLink(m.home,"homeName");
  detail.append(date,home);
  var meta=document.createElement("div");meta.className="meta";
  var hl=document.createElement("strong");hl.textContent="HOME";
  var league=document.createElement("span");league.textContent="Southern League Div 1 South";
  meta.append(hl,league);
  var score=document.createElement("div");score.className="score";
  var final=/^(FT|AET|PEN)$/i.test(m.status||"");
  var scored=final&&m.homeScore!=null&&m.awayScore!=null;
  score.textContent=scored?String(m.homeScore)+"–"+String(m.awayScore):"—";
  var when=document.createElement("span");when.className="kickoff";
  when.textContent=scored?"FULL TIME":(/^(P|P-P|POST)$/i.test(m.status||"")?"POSTPONED":m.time||"15:00");
  score.append(when);
  var away=teamLink(m.away,"awayName");
  row.append(badge,detail,meta,score,away);list.append(row);
 });
 document.getElementById("source").textContent="Football Web Pages · Updated periodically";
};
script.src="https://script.google.com/macros/s/AKfycbyuoOyNsgayGU5-_k6VmH-l450riaeFbjzmQTm67XfxXOZ1JkQMh4Zr22KLHQOaRhwr/exec"+"?v="+Math.floor(Date.now()/600000);
script.onerror=function(){if(!received)renderMessage("Fixture feed temporarily unavailable.");};
document.head.appendChild(script);
setTimeout(function(){if(!received)renderMessage("Still waiting for the fixture feed. Try refreshing.");},12000);
})();
</script>
</body></html>
