<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Around the League | Tiverton Town FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--yellow:#ffda00;--ink:#111}*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:#111;font-family:Arial,Helvetica,sans-serif}
.widget{width:100%;background:var(--yellow);border:3px solid #111;overflow:hidden}
.head{background:#111;padding:18px 24px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.headCopy{min-width:0}.eyebrow{font:700 13px Antonio,Impact,sans-serif;color:#ffda00;text-transform:uppercase}
h1{color:#ffda00;font:700 clamp(25px,3.5vw,36px)/1.07 Antonio,Impact,sans-serif;margin:3px 0 0;letter-spacing:.1px}
.sub{color:#111;font:700 14px Arial,sans-serif;margin:0}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#ffda00;color:#111;padding:15px 20px 10px;font:700 19px Antonio,Impact,sans-serif}
.strip small{font:700 14px Antonio,Impact,sans-serif;white-space:nowrap}
.list{padding:0 20px 10px;background:var(--yellow)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 94px minmax(0,1fr);gap:12px;align-items:center;min-height:54px;padding:9px 12px;border-bottom:1px solid #17171744}
.game:nth-child(even){background:#fff}
.team{font-size:16px;font-weight:700;line-height:1.28;overflow-wrap:break-word}
.team a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.team a:hover,.team a:focus-visible{border-bottom-color:#111;text-decoration:underline;outline-offset:3px}
.home{text-align:right}.away{text-align:left}
.score{text-align:center;color:#111;font:700 25px Antonio,Impact,sans-serif;white-space:nowrap}
.kickoff{display:block;color:#333;text-align:center;font:13px Arial,sans-serif;white-space:nowrap;margin-top:2px}
.datebar{background:#ffda00;color:#111;font-size:14px;padding:0 20px 13px}
.foot{display:flex;justify-content:space-between;gap:10px;padding:13px 20px;align-items:center;flex-wrap:wrap;background:#111;color:#ddd;font-size:11px}
.foot a{color:#ffda00;font:700 17px Antonio,Impact,sans-serif;text-decoration:none}
.message{padding:25px 15px;text-align:center;color:#111;font-size:14px;background:#ffda00}
@media(max-width:500px){.head{padding:15px}.strip{padding:11px 12px;font-size:17px}.datebar{padding:0 12px 12px;font-size:12px}.list{padding:0 6px 8px}.game{grid-template-columns:minmax(0,1fr) 57px minmax(0,1fr);gap:6px;padding:11px 5px}.team{font-size:12px}.score{font-size:21px}.kickoff{font-size:10px}.foot{padding:12px}}
</style></head><body>
<section class="widget" aria-label="Other Southern League Division One South fixtures">
<header class="head"><div class="headCopy"><h1>AROUND THE LEAGUE</h1></div></header><div class="datebar" id="matchDate">Checking the next matchday…</div>
<div class="strip"><span id="stripTitle">OTHER LEAGUE FIXTURES</span><small id="stripCount"></small></div>
<div class="list" id="fixtures" aria-live="polite"><div class="message">Loading league fixtures…</div></div>
<footer class="foot"><span id="source">Football Web Pages · League data</span><a href="https://www.southern-football-league.co.uk/overview/divonesouth" target="_blank" rel="noopener noreferrer">FULL FIXTURE LIST ↗</a></footer>
</section>
<script>
(function(){
"use strict";
var list=document.getElementById("fixtures"), dateEl=document.getElementById("matchDate");
var titleEl=document.getElementById("stripTitle"), countEl=document.getElementById("stripCount");
var script=document.createElement("script"),received=false;
function londonToday(){
 var pieces=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 var o={};pieces.forEach(function(p){o[p.type]=p.value;});return o.year+"-"+o.month+"-"+o.day;
}
function dateLabel(d){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{timeZone:"Europe/London",weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function isSaturday(d){return new Date(d+"T12:00:00Z").getUTCDay()===6;}
var clubProfiles={
 "bideford":"bideford-afc","bideford afc":"bideford-afc","larkhall athletic":"larkhall-athletic",
 "bristol manor farm":"bristol-manor-farm","willand rovers":"willand-rovers",
 "exmouth town":"exmouth-town","paulton rovers":"paulton-rovers",
 "hungerford town":"hungerford-town","worcester raiders":"wors-raiders",
 "melksham town":"melksham-town","falmouth town":"falmouth-town",
 "portland united":"portland-utd","portland utd":"portland-utd","hartpury":"hartpury",
 "shaftesbury":"Shaftesbury%20FC","shaftesbury fc":"Shaftesbury%20FC","barnstaple town":"barnstaple-town",
 "slimbridge":"Slimbridge","slimbridge afc":"Slimbridge",
 "weymouth":"weymouth","weymouth fc":"weymouth",
 "westbury united":"westbury-united","dorchester town":"dorchester-town",
 "bishops cleeve":"bishops-cleeve","bishop's cleeve":"bishops-cleeve",
 "sporting club inkberrow":"sporting-club-inkberrow","swindon supermarine":"swindon-supermarine",
 "tiverton town":"tiverton-town"
};
function teamLink(team,side){
 var outer=document.createElement("div");outer.className="team "+side;
 var key=String(team||"").trim().toLowerCase().replace(/\s+/g," ");
 var slug=clubProfiles[key];
 if(slug){
  var a=document.createElement("a");
  a.href="https://www.southern-football-league.co.uk/clubs/"+slug;
  a.target="_blank";a.rel="noopener noreferrer";
  a.title="View "+team+" on the Southern League website (opens new tab)";
  a.textContent=team;
  outer.append(a);
 }else{outer.textContent=team;}
 return outer;
}
function renderMessage(t){list.replaceChildren();var el=document.createElement("div");el.className="message";el.textContent=t;list.append(el);}
window.tivvyFixturesReady=function(data){
 received=true;if(!data||data.success!==true||!Array.isArray(data.fixtures)){renderMessage("Fixture feed temporarily unavailable.");return;}
 var today=londonToday();
 var all=data.fixtures.filter(function(m){return m&&/^\d{4}-\d{2}-\d{2}$/.test(m.date)&&isSaturday(m.date)&&m.date>=today&&!/tiverton/i.test((m.home||"")+" "+(m.away||""));});
 all.sort(function(a,b){return a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||"");});
 var matchday=all.length?all[0].date:null;
 if(!matchday){dateEl.textContent="No upcoming Saturday fixtures currently listed";renderMessage("Please check the Southern League fixtures page.");return;}
 var games=all.filter(function(m){return m.date===matchday;});
 dateEl.textContent=dateLabel(matchday)+" · Excluding Tiverton Town";
 var finished=games.filter(function(m){return /^(FT|AET|PEN)$/i.test(m.status||"");}).length;
 titleEl.textContent=finished===games.length?"MATCHDAY RESULTS":finished>0?"FIXTURES & RESULTS":"OTHER LEAGUE FIXTURES";
 countEl.textContent=games.length+" MATCH"+(games.length===1?"":"ES");
 list.replaceChildren();
 games.forEach(function(m){
  var row=document.createElement("div");row.className="game";
  var home=teamLink(m.home,"home");
  var mid=document.createElement("div");mid.className="score";
  var isFinal=/^(FT|AET|PEN)$/i.test(m.status||"");
  var scored=isFinal&&m.homeScore!=null&&m.awayScore!=null;
  mid.textContent=scored?String(m.homeScore)+" – "+String(m.awayScore):"v";
  var when=document.createElement("span");when.className="kickoff";
  when.textContent=scored?"FULL TIME":(/^(P|P-P|POST)$/i.test(m.status||"")?"POSTPONED":m.time||"15:00");
  mid.append(when);
  var away=teamLink(m.away,"away");
  row.append(home,mid,away);list.append(row);
 });
 document.getElementById("source").textContent="Football Web Pages · Updated periodically";
};
script.src="https://script.google.com/macros/s/AKfycbyuoOyNsgayGU5-_k6VmH-l450riaeFbjzmQTm67XfxXOZ1JkQMh4Zr22KLHQOaRhwr/exec"+"?v="+Math.floor(Date.now()/600000);
script.onerror=function(){if(!received)renderMessage("Fixture feed temporarily unavailable.");};
document.head.appendChild(script);
setTimeout(function(){if(!received)renderMessage("Still waiting for the fixture feed. Try refreshing.");},12000);
})();
</script>
</body></html>
